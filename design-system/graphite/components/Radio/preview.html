<!doctype html>
<html>
<head><meta charset="utf-8"><title>Radio — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      h('fieldset', { style: { border: 0, margin: 0, padding: 0 } },
        h('legend', { style: { fontSize: 12, lineHeight: '20px', color: 'var(--text-secondary)' } }, 'Service type ', h('span', { className: 'gr-req' }, '*')),
        row(h(G.Radio, { name: 'svc', label: 'Certification', defaultChecked: true }), h(G.Radio, { name: 'svc', label: 'Training' }), h(G.Radio, { name: 'svc', label: 'Second-party audit' }), h(G.Radio, { name: 'svc2', label: 'Disabled', disabled: true })))
    )
  );
</script>
</body>
</html>

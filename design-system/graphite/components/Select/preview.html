<!doctype html>
<html>
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Dropdown widths add 68px (48px icon area + 4px right padding)'),
      h(G.Select, { label: 'Who will pay for this service?', required: true, placeholder: 'Select a payer...', helpText: 'List of the Seller and the added parties', options: [{ value: 'seller', label: 'Seller — SGS Nairobi' }, { value: 'buyer', label: 'Buyer' }] }),
      h(G.Select, { label: 'Country of destination', size: 's', defaultValue: 'sa', options: [{ value: 'sa', label: 'Saudi Arabia' }, { value: 'ae', label: 'UAE' }] }),
      h(G.Select, { label: 'Contact', required: true, placeholder: 'No roles selected', error: 'Select a contact.', options: [{ value: 'j', label: 'John Doe' }] })
    )
  );
</script>
</body>
</html>

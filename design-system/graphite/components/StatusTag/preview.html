<!-- @dsCard group="Status" height=320 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusTag — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('md 32px — Document Item, SR header'),
      row(h(G.StatusTag, { status: 'completed' }), h(G.StatusTag, { status: 'under-review' }), h(G.StatusTag, { status: 'needs-description' }), h(G.StatusTag, { status: 'missing-info' }), h(G.StatusTag, { status: 'rejected' }), h(G.StatusTag, { status: 'draft' }), h(G.StatusTag, { status: 'info', label: 'Awaiting SGS review' })),
      cap('sm 24px — tables, mobile cards'),
      row(h(G.StatusTag, { status: 'completed', size: 'sm', label: 'Certificate issued' }), h(G.StatusTag, { status: 'missing-info', size: 'sm', label: 'Action required' })),
      cap('compact — small breakpoints; icon only, label kept as aria-label + tooltip'),
      row(h(G.StatusTag, { status: 'completed', compact: true }), h(G.StatusTag, { status: 'under-review', compact: true }), h(G.StatusTag, { status: 'missing-info', compact: true }), h(G.StatusTag, { status: 'rejected', compact: true }))
    )
  );
</script>
</body>
</html>

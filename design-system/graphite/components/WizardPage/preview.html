<!-- @dsCard group="Page templates" height=900 width=1440 page -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>WizardPage — page template</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
    { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },
    { type: 'label', label: 'Other services' }, { id: 'sr-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'needs action' }, { id: 'sr-impl', label: 'Implementation Support' } ] };
  var NAV = [{ items: [
    { id: 'home', label: 'Home', icon: 'dashboard' }, { id: 'scopes', label: 'Scopes', icon: 'category' }, { id: 'ws', label: 'Workspaces', icon: 'folders' },
    { id: 'docs', label: 'Documents', icon: 'document--multiple-01' }, SR, { id: 'training', label: 'Training', icon: 'education' },
    { id: 'audit', label: 'Audit Logs', icon: 'catalog' }, { id: 'settings', label: 'Settings', icon: 'settings' } ] },
    { label: 'Administration', items: [{ id: 'users', label: 'Users', icon: 'user--multiple' }, { id: 'access', label: 'Workspace access', icon: 'user--access' }] }];
  function Shell(props){
    return h('div', { style: { width: 1440, height: 900, boxSizing: 'border-box', padding: 12, display: 'flex', flexDirection: 'column', gap: 12, background: 'var(--background)', fontFamily: 'var(--font-sans)', color: 'var(--text-primary)', overflow: 'hidden' } },
      h(G.TopBar, { variant: 'home', siteName: 'Digital Trust Platform', siteSub: 'Customer Portal', userName: 'Linh Tran', userEmail: 'linh.tran@abc-trading.com', notifications: 3 }),
      h('div', { style: { flex: 1, minHeight: 0, display: 'flex', gap: 12 } },
        h('div', { style: { flexShrink: 0 } }, h(G.AppSidebar, { label: 'Customer Portal', sections: NAV, defaultActive: props.active || 'sr-gap', defaultCollapsed: !!props.collapsed })),
        h('main', { style: { flex: 1, minWidth: 0, minHeight: 0, display: 'flex', flexDirection: 'column', gap: 12 } }, props.children)));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h(Shell, { collapsed: true },
      h(G.PageHeader, { title: 'New Gap Analysis', subtitle: 'Step 2 of 5 · Scope', onBack: function(){}, status: { status: 'draft', label: 'Draft — not yet submitted', shortLabel: 'Draft' }, autosave: 'saved',
        actions: h(React.Fragment, null, h(G.Button, { variant: 'secondary', size: 'md' }, 'Keep as Draft'), h(G.Button, { size: 'md', disabled: true }, 'Submit Request')) }),
      h('div', { style: { flex: 1, minHeight: 0, display: 'flex', gap: 20 } },
        h('div', { style: { width: 220, flexShrink: 0, padding: 12, boxSizing: 'border-box', borderRadius: 16, background: 'var(--layer-02)' } },
          h(G.SectionNav, { label: 'Steps', defaultActive: 'scope', items: [{ id: 'fw', label: '1. Framework', status: 'complete' }, { id: 'scope', label: '2. Scope', status: 'incomplete' }, { id: 'ws', label: '3. Workspace', status: 'incomplete' }, { id: 'det', label: '4. Details', status: 'incomplete' }, { id: 'rev', label: '5. Review & submit' }] })),
        h('div', { style: { flex: 1, minWidth: 0, overflow: 'auto', display: 'flex', flexDirection: 'column', gap: 20 } },
          h(G.Card, { number: 2, title: 'Scope', subtitle: 'Which part of your organisation should SGS assess against ISO/IEC 27001?', extend: true,
            footer: h('div', { style: { display: 'flex', justifyContent: 'space-between', width: '100%' } }, h(G.Button, { variant: 'ghost', size: 'md' }, 'Back'), h(G.Button, { size: 'md', icon: 'arrow--right' }, 'Next')) },
            h('fieldset', { style: { border: 0, margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 4 } },
              h('legend', { className: 'label-small', style: { color: 'var(--text-secondary)', marginBottom: 4 } }, 'Scope ', h('span', { className: 'gr-req' }, '*')),
              h(G.Radio, { name: 'sc', label: 'Use an existing scope', defaultChecked: true }),
              h(G.Radio, { name: 'sc', label: 'Describe a new scope (your admin will review it)' }),
              h(G.Radio, { name: 'sc', label: 'Not sure yet — let SGS advise' })),
            h(G.Combobox, { label: 'Existing scope', required: true, defaultValue: 'hq', helpText: 'You only see scopes assigned to you.', options: [{ value: 'hq', label: 'Head office · Taipei', description: 'Organisation scope · 3 sites' }, { value: 'ai', label: 'AI platform', description: 'Product scope' }] }),
            h(G.InlineNotification, { kind: 'info', title: 'A workspace already exists for this scope' }, 'ISO/IEC 27001 · Head office is 64% ready. SGS will use it as the starting point.')))))
  );
</script>
</body>
</html>

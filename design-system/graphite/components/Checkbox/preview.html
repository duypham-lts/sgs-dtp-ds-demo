<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      row(h(G.Checkbox, { label: 'Keep me signed in' }), h(G.Checkbox, { label: 'I confirm the information is accurate', defaultChecked: true }), h(G.Checkbox, { label: 'Disabled', disabled: true }), h(G.Checkbox, { label: 'Disabled checked', disabled: true, defaultChecked: true }))
    )
  );
</script>
</body>
</html>

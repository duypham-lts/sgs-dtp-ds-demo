<!doctype html>
<html>
<head><meta charset="utf-8"><title>InlineNotification — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      h('div', { style: { maxWidth: 320 } }, h(G.InlineNotification, { kind: 'warning', title: 'Required Information', items: ['Buyer company', 'Payer assignment', 'Payer Tax ID', 'CoC Collector'] })),
      h(G.InlineNotification, { kind: 'error', title: 'Action required: Upload requested documents', onClose: function(){} }, 'The reviewer asked for 2 more documents before the audit can be scheduled.'),
      h(G.InlineNotification, { kind: 'info', title: 'Need help?', action: h(G.Button, { variant: 'tertiary', size: 'sm' }, 'Contact Support') }, 'Contact SGS support for assistance with your service request creation.'),
      h(G.InlineNotification, { kind: 'success', title: 'Certificate issued' }, 'ISO/IEC 27001 certificate CN-2026-00412 is now valid until 14 Sep 2029.')
    )
  );
</script>
</body>
</html>

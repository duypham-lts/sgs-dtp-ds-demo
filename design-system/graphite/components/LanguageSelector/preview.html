<!doctype html>
<html>
<head><meta charset="utf-8"><title>LanguageSelector — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo', style: { minHeight: 212 } },
      cap('Top bar, right side. Default shows code + native name; compact (small breakpoints) shows the code only.'),
      h('div', { style: { display: 'flex', gap: 200, alignItems: 'flex-start' } },
        h(G.LanguageSelector, { defaultOpen: true, align: 'start' }),
        h(G.LanguageSelector, { compact: true, defaultValue: 'zh-Hant' }))
    )
  );
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Ghost (default) · primary · secondary — always carries a label (aria-label + tooltip)'),
      row(h(G.IconButton, { icon: 'close', label: 'Close' }), h(G.IconButton, { icon: 'add', label: 'Add', variant: 'primary' }), h(G.IconButton, { icon: 'arrow--right', label: 'Next', variant: 'secondary' }), h(G.IconButton, { icon: 'search', label: 'Search', size: 'md' }), h(G.IconButton, { icon: 'add', label: 'Add', variant: 'primary', disabled: true }))
    )
  );
</script>
</body>
</html>

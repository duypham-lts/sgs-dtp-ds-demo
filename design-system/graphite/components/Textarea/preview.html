<!doctype html>
<html>
<head><meta charset="utf-8"><title>Textarea — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      h(G.Textarea, { label: 'Document description', required: true, placeholder: 'Describe what this document proves', helpText: 'Up to 500 characters.' }),
      h(G.Textarea, { label: 'Response to finding', rows: 3, error: 'A response is required before you submit.' })
    )
  );
</script>
</body>
</html>

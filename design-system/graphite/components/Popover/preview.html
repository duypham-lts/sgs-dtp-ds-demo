<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row', style: { alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Anchored panel for filters and small forms. Click outside or Esc closes. (Radix Popover)'),
      h(G.Popover, { defaultOpen: true, title: 'Filter requests', trigger: h(G.Button, { variant: 'tertiary', size: 'md' }, 'Filter') },
        h('div', { style: { display: 'flex', flexDirection: 'column' } }, h(G.Checkbox, { label: 'Action required', defaultChecked: true }), h(G.Checkbox, { label: 'Under review' }), h(G.Checkbox, { label: 'Certificate issued' })))
    )
  );
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pagination — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  function Demo(){ var p = React.useState(2), s = React.useState(10);
    return h('div', { style: { background: 'var(--layer-02)', borderRadius: 8 } }, h(G.Pagination, { totalItems: 100, page: p[0], pageSize: s[0], onPageChange: p[1], onPageSizeChange: function(n){ s[1](n); p[1](1); } })); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo', style: { background: 'var(--background)' } },
      cap('Items per page · range · page picker · previous/next (matches the table footer in the SR mockups)'),
      h(Demo),
      cap('First page — previous disabled'),
      h('div', { style: { background: 'var(--layer-02)', borderRadius: 8 } }, h(G.Pagination, { totalItems: 42, page: 1, pageSize: 10, onPageChange: function(){} }))
    )
  );
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>NotificationCenter — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  var items = [
    { id: 'n1', type: 'review', tone: 'warning', title: 'Evidence needs changes', body: 'Anna Lee asked for a newer version of the access control policy (A.5.15).', ref: 'ISO/IEC 27001 · Head office', time: '10 min ago', group: 'Today', unread: true },
    { id: 'n2', type: 'status', tone: 'info', title: 'Gap analysis is in progress', body: 'Consultant Anna Lee can now read your workspace.', ref: 'GA-2026-005', time: '2 h ago', group: 'Today', unread: true },
    { id: 'n3', type: 'document', title: 'New deliverable shared', body: 'Information security policy v4', ref: 'IS-2026-003', time: 'Yesterday', group: 'Earlier', unread: true },
    { id: 'n4', type: 'certificate', tone: 'warning', title: 'Surveillance audit due in 60 days', body: 'ISO/IEC 27001 certificate · Head office', ref: 'CERT-TW-2025-118', time: '22 Sep', group: 'Earlier' },
    { id: 'n5', type: 'status', tone: 'success', title: 'Gap analysis completed', body: 'The final report is available.', ref: 'GA-2026-002', time: '30 Sep', group: 'Earlier' } ];
  function box(title, el){ return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } }, h('div', { className: 'gr-demo__cap' }, title), h('div', { style: { width: 420, padding: 16, boxSizing: 'border-box', borderRadius: 8, background: 'var(--layer-02)', boxShadow: 'var(--shadow-overlay)' } }, el)); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo', style: { display: 'flex', flexWrap: 'wrap', gap: 32, alignItems: 'flex-start' } },
      box('Unread (default tab)', h(G.NotificationCenter, { items: items })),
      box('All — inbox and history', h(G.NotificationCenter, { items: items, defaultTab: 'all', hasMore: true })),
      box('Nothing unread', h(G.NotificationCenter, { items: items.map(function(n){ return Object.assign({}, n, { unread: false }); }) })))
  );
</script>
</body>
</html>

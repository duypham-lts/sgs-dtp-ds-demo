<!doctype html>
<html>
<head><meta charset="utf-8"><title>FileUpload — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row', style: { alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      h(G.FileUpload, { label: 'Supporting documents', required: true, maxSizeMB: 20, defaultFiles: [
        { name: 'invoice234657.pdf', size: 2516582, status: 'complete' },
        { name: 'test-report-2026.pdf', size: 5400000, status: 'uploading', progress: 62 },
        { name: 'packing-list.xlsx', size: 812000, status: 'scanning' },
        { name: 'factory-photos.zip', size: 48000000, status: 'error', error: 'File is larger than 20 MB. Split it or contact support.' } ] })
    )
  );
</script>
</body>
</html>

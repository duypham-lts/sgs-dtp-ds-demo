<!doctype html>
<html>
<head><meta charset="utf-8"><title>NotificationBadge — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row', style: { alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Count on the notification bell; dot for "something new" without a number'),
      row(h(G.NotificationBadge, { count: 3 }, h(G.IconButton, { icon: 'notification', label: 'Notifications' })), h(G.NotificationBadge, { count: 128 }, h(G.IconButton, { icon: 'notification', label: 'Notifications' })), h(G.NotificationBadge, { dot: true, label: 'New messages' }, h(G.IconButton, { icon: 'events', label: 'Communications' })))
    )
  );
</script>
</body>
</html>

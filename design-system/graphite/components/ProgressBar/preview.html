<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressBar — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row', style: { alignItems: 'flex-start' } }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      h(G.ProgressBar, { label: 'Readiness · ISO/IEC 27001', value: 64, helperText: '49 of 77 requirements have accepted evidence' }),
      h(G.ProgressBar, { label: 'Upload complete', value: 100 }),
      h(G.ProgressBar, { label: 'Upload failed', value: 38, status: 'error', helperText: 'Connection lost. Try again.' }),
      h(G.ProgressBar, { label: 'Small (file rows)', value: 45, size: 'sm' })
    )
  );
</script>
</body>
</html>

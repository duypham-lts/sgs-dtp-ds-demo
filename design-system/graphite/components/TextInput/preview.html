<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextInput — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Widths S 232 · M 392 (default) · L 552 — fields never stretch with the screen'),
      h(G.TextInput, { label: 'Postal code', size: 's', placeholder: '00100' }),
      h(G.TextInput, { label: 'Reference', placeholder: 'e.g. PO-2026-0042' }),
      h(G.TextInput, { label: 'Company legal name', size: 'l', placeholder: 'SGS Nairobi Limited' }),
      cap('Password (show/hide) · read-only'),
      row(h(G.TextInput, { label: 'Password', type: 'password', required: true, defaultValue: 'secret123' }), h(G.TextInput, { label: 'Tenant', size: 's', readOnly: true, defaultValue: 'SGS-KE-01' }))
    )
  );
</script>
</body>
</html>

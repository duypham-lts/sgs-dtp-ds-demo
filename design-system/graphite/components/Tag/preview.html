<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tag — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var G = window.Graphite, h = React.createElement;
  function row(){ return h.apply(null, ['div', { className: 'gr-demo__row' }].concat([].slice.call(arguments))); }
  function cap(t){ return h('div', { className: 'gr-demo__cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'gr-demo' },
      cap('Neutral · required · info — words, not state (for state use StatusTag)'),
      row(h(G.Tag, null, 'ISO/IEC 27001'), h(G.Tag, { tone: 'required' }, 'Required'), h(G.Tag, { tone: 'info' }, 'Optional'))
    )
  );
</script>
</body>
</html>

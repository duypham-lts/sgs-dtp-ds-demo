<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGS Digital Trust Platform · Customer Portal prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --orange:#CA4300; --orange-hover:#A93800; --peach:#FF9966; --burgundy:#8E0B3D;
  --charcoal:#3C525D; --slate:#65899A; --text:#28373E; --text2:#3C525D; --ph:#8FA3AD;
  --bg:#EDF2F7; --col:#E2E8EB; --card:#E2E8EB; --sub:#D3DDE2; --field:#EEF2F4; --field-h:#E6ECEF; --ext:#E0E7EB;
  --white:#FFFFFF; --surface:#F9FAFB; --outline:#7A8285;
  --green:#24A148; --green-bg:#D9F3E4; --red:#DA1E28; --red-bg:#FEE7E7; --blue:#085CC2; --blue-bg:#D6E6FB;
  --yellow:#F1C21B; --yellow-bg:#FFF6E5; --nav-active:#FDDCCB;
  --dis-bg:#C6C6C6; --dis-tx:#8D8D8D;
  --font:Roboto,"Noto Sans","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --gap:20px; --pad-card:24px; --pad-right:16px; --head-gap:32px;
}
:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
img,svg{max-width:100%}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.ic.sm{width:20px;height:20px}
.ic.xs{width:16px;height:16px}
.si{width:16px;height:16px;fill:currentColor;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Big area & shell (95% rule, 960–1980) ---------- */
.app{height:100dvh;display:flex;flex-direction:column;min-width:960px;max-width:1980px;margin:0 auto}
.shell{width:95.5%;margin:0 auto}
.main-scroll{flex:1;overflow:auto;min-height:0;padding-bottom:48px}

/* ---------- Top bar ---------- */
.topbar{margin-top:12px;flex:none}
.tb{height:48px;background:var(--white);border-radius:12px;display:flex;align-items:center;padding:0 16px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--charcoal)}
.logo b{font:700 20px/28px var(--font);letter-spacing:.5px}
.logo .site{font:500 14px/20px var(--font);color:var(--text)}
.logo .sep{width:1px;height:20px;background:var(--charcoal)}
.logo .portal{font:400 12px/20px var(--font);color:var(--text2)}
.tb-links{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-link{text-decoration:none;font:500 14px/20px var(--font);color:var(--text2);padding:6px 12px;border-radius:16px;display:flex;align-items:center;gap:6px}
.tb-link:hover{background:rgba(101,137,154,.12)}
.tb-link.on{color:var(--orange)}
.tb-link .ic{display:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--charcoal);position:relative}
.icon-btn:hover{background:rgba(101,137,154,.12)}
.icon-btn.on{color:var(--orange)}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--orange);color:#fff;font:500 12px/16px var(--font);padding:0 4px}
.topbar.clear .tb{background:transparent}
.topbar.clear .logo,.topbar.clear .logo .site,.topbar.clear .logo .portal{color:#fff}
.topbar.clear .logo .sep{background:#fff}

/* ---------- Buttons ---------- */
.btn{height:40px;padding:0 20px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px var(--font);white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-hover)}
.btn-dark{background:var(--charcoal);color:#fff}
.btn-dark:hover{background:#2E4049}
.btn-ghost{border:1px solid var(--charcoal);color:var(--charcoal);height:32px;padding:0 14px;border-radius:16px}
.btn-ghost:hover{background:rgba(60,82,93,.08)}
.btn-text{color:var(--orange);height:32px;padding:0 8px}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--dis-bg);color:var(--dis-tx);cursor:not-allowed;border-color:transparent}
.btn .ic{width:20px;height:20px}

/* ---------- Tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;font:500 12px/20px var(--font);white-space:nowrap;color:var(--text)}
.t-green{background:var(--green-bg)} .t-green .si{color:#1B7A37}
.t-red{background:var(--red-bg)} .t-red .si{color:var(--red)}
.t-blue{background:var(--blue-bg)} .t-blue .si{color:var(--blue)}
.t-yellow{background:#FFE9B8} .t-yellow .si{color:var(--text)}
.t-draft{background:#DCE3E7} .t-draft .si{color:var(--charcoal)}
.t-grey{background:#E4E7E9;color:var(--text2)}
.t-review{background:transparent;border:1px solid #B9C6CC;color:var(--text2);font-style:italic;font-weight:400}
.t-req{background:#FFE3A3;height:20px;padding:0 8px;border-radius:6px;font:500 12px/20px var(--font)}
.autosave{display:flex;align-items:center;gap:6px;color:var(--text2);font:400 12px/20px var(--font)}

/* ---------- Fields ---------- */
.row{display:flex;flex-wrap:wrap;gap:16px 24px;margin-top:16px}
.fld{position:relative;display:flex;flex-direction:column}
.fbox{background:var(--field);border-bottom:1px solid var(--charcoal);border-radius:4px 4px 0 0;padding:6px 16px 6px 16px;min-height:52px;display:flex;flex-direction:column;justify-content:center;position:relative}
.fbox:hover{background:var(--field-h)}
.fbox:focus-within{border-bottom:2px solid var(--orange);padding-bottom:5px}
.fbox label{font:400 12px/20px var(--font);color:var(--text2)}
.req{color:var(--orange)}
.fbox input,.fbox select,.fbox textarea{border:0;background:transparent;outline:none;font:400 16px/24px var(--font);color:var(--text);padding:0;width:100%;appearance:none;-webkit-appearance:none}
.fbox textarea{resize:vertical;min-height:72px}
.fbox input::placeholder,.fbox textarea::placeholder{color:var(--ph)}
.fbox select:invalid{color:var(--ph)}
.fbox.sel{padding-right:52px}
.fbox.sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--charcoal)}
.fbox.srch{padding-right:52px}
.fbox.srch .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--charcoal)}
.help{font:400 12px/20px var(--font);color:var(--text2);padding:4px 16px 0}
.help a{color:var(--orange)}
.err{font:400 12px/20px var(--font);color:var(--orange);padding:4px 16px 0}
.fld.has-err .fbox{border-bottom-color:var(--orange)}
/* width tokens: text +32, dropdown +68 */
.w-xs{width:96px}.w-s{width:232px}.w-s.dd{width:268px}.w-m,.w-m.dd{width:428px}.w-l,.w-l.dd{width:588px}
.fld{max-width:100%}

/* choice tiles */
.tiles{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
.tile{width:392px;max-width:100%;text-align:left;background:var(--sub);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start;color:var(--text)}
.tile:hover{background:#C9D4DA}
.tile[aria-pressed="true"]{background:var(--white);box-shadow:inset 0 0 0 2px var(--orange)}
.tile .ic{color:var(--charcoal)}
.tile b{display:block;font:500 16px/24px var(--font)}
.tile span{font:400 12px/20px var(--font);color:var(--text2)}

/* ---------- Page header ---------- */
.phead{display:flex;align-items:center;gap:var(--head-gap);padding:16px 0;flex:none}
.phead .back{width:40px;height:40px;border-radius:50%;border:1px solid var(--charcoal);display:grid;place-items:center;color:var(--charcoal);flex:none}
.phead .back:hover{background:rgba(60,82,93,.08)}
.ptitle{display:flex;align-items:center;gap:16px;min-width:0}
.ptitle h1{margin:0;font:400 24px/36px var(--font);color:var(--text);white-space:nowrap}
.ptitle p{margin:0;font:400 12px/20px var(--font);color:var(--text2)}
.phead .acts{margin-left:auto;display:flex;gap:12px}
.phead .acts .ic{display:none}

/* ---------- 3-column SR layout ---------- */
.sr-grid{flex:1;min-height:0;display:grid;grid-template-columns:14.7% minmax(0,1fr) 284px;gap:var(--gap);padding-bottom:16px}
.col{min-height:0;border-radius:16px}
.col-left{background:var(--col);padding:16px 8px;overflow:hidden}
.col-mid{overflow:auto;display:flex;flex-direction:column;gap:var(--gap);container-type:inline-size;scroll-behavior:smooth}
.col-right{background:var(--col);padding:var(--pad-right);display:flex;flex-direction:column;gap:16px;overflow:hidden}
.ext{flex:1 0 64px;background:var(--ext);border-radius:24px}
.vnav{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.vnav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;text-decoration:none;color:var(--text);font:400 14px/20px var(--font)}
.vnav a:hover{background:rgba(101,137,154,.12)}
.vnav a.on{background:var(--nav-active)}
.vnav .ic{display:none}
.vnav .dot{margin-left:auto;width:6px;height:6px;border-radius:3px;background:var(--orange)}
.vnav .ok{margin-left:auto;color:var(--green)}
.card{background:var(--card);border-radius:24px;padding:var(--pad-card)}
.card-h{display:flex;align-items:center;gap:12px}
.num{width:24px;height:24px;border-radius:12px;background:var(--charcoal);color:#fff;display:grid;place-items:center;font:500 12px/20px var(--font);flex:none}
.card-h h2{margin:0;font:500 20px/28px var(--font)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-sub{margin:0 0 0 36px;color:var(--text2);font:400 14px/20px var(--font)}
.subcard{background:var(--sub);border-radius:16px;padding:16px}
.subcard h3{margin:0;font:500 16px/24px var(--font)}
.meta-bar{background:var(--card);border-radius:16px;padding:12px var(--pad-card);display:flex;gap:32px;flex-wrap:wrap;align-items:center}
.meta-bar span{color:var(--text2)} .meta-bar b{font-weight:500;color:var(--text)}
.rt{font:500 16px/24px var(--font);margin:0}
.info-card{background:var(--yellow-bg);border:1px solid #F2B64A;border-radius:16px;padding:16px}
.info-card h3,.help-card h3{margin:0 0 8px;font:500 14px/20px var(--font)}
.info-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.info-card li button{display:flex;gap:8px;align-items:center;text-align:left;font:400 12px/20px var(--font);color:var(--text)}
.info-card li button:hover{color:var(--orange)}
.info-card li .si{color:#E08A00}
.info-card.done{background:var(--green-bg);border-color:#8FD4A9}
.help-card{background:var(--white);border:1px solid var(--charcoal);border-radius:16px;padding:16px}
.help-card p{margin:0 0 12px;font:400 12px/20px var(--font);color:var(--text2)}

/* ---------- Document item ---------- */
.docs{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.doc{container-type:inline-size;background:var(--surface);border:1px solid var(--outline);border-radius:12px}
.doc-row{display:flex;align-items:center;gap:16px;padding:10px 12px 10px 16px;min-height:60px}
.doc .a1{color:var(--text);display:grid;place-items:center}
.doc .a2{flex:1;min-width:0}
.doc .a2 b{display:block;font:500 14px/20px var(--font)}
.doc .a2 small{display:block;font:400 12px/20px var(--font);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .a3 .tag{width:172px;justify-content:center;height:32px;border-radius:8px;font:500 14px/20px var(--font)}
.doc .a3 .dot-st{display:none;width:32px;height:32px;border-radius:16px;place-items:center}
.doc .a4{display:flex;gap:4px}
.doc .a4 .icon-btn{width:40px;height:40px}
.doc .a4 .more{display:none}
.doc.sgs{border-color:var(--blue)} .doc.sgs .a2 b,.doc.sgs .a4 .icon-btn{color:var(--blue)}
.doc.action{border:1px dashed var(--orange)} .doc.action .a2 b,.doc.action .up{color:var(--orange)}
.doc.review .a1,.doc.review .a2{opacity:.5}
.acc-trig{display:inline-flex;align-items:center;gap:4px;font:400 12px/20px var(--font);color:var(--text2)}
.acc-trig:hover{color:var(--text)}
.a5{padding:0 16px 16px}
.a5 table{width:100%;border-collapse:collapse;font:400 12px/20px var(--font)}
.a5 th{text-align:left;color:var(--text2);font-weight:500;padding:6px 8px;border-bottom:1px solid #C9D3D8}
.a5 td{padding:8px;border-bottom:1px solid #E1E6E9;vertical-align:top}
@container (max-width:560px){
  .doc .a1{display:none}
  .doc .a3 .tag{display:none}
  .doc .a3 .dot-st{display:grid}
  .doc .a4 .icon-btn:not(.more){display:none}
  .doc .a4 .more{display:grid}
}
.upload-zone{margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* ---------- Home table ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;padding:28px 0 20px}
.h-page{margin:0;font:400 28px/40px var(--font)}
.sub{margin:0;color:var(--text2)}
.toolbar{display:flex;gap:0.3%;align-items:center;margin-bottom:16px}
.search{width:66%;min-width:0;max-width:1005px}
.search .fbox{background:var(--white);border:1px solid var(--orange);border-radius:28px;min-height:48px;padding:0 52px 0 20px}
.search .fbox:focus-within{border-width:2px;padding:0 51px 0 19px}
.search .fbox input{font-size:14px}
.search .fbox .chev{right:16px}
.filter{width:16%;min-width:160px;margin-left:0.3%}
.filter .fbox{background:var(--white);border:0;border-radius:24px;min-height:48px;padding:0 44px 0 16px}
.filter .fbox select{font:500 14px/20px var(--font)}
.toolbar .btn{margin-left:auto;min-width:10%;height:48px;border-radius:24px}
.attn{background:var(--white);border-radius:16px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.attn .si{color:var(--red);width:20px;height:20px}
.attn p{margin:0;flex:1}
.tcard{background:var(--white);border-radius:16px;padding:8px 24px 16px;overflow-x:auto}
.tcard table{width:100%;border-collapse:collapse;min-width:900px}
.tcard th{text-align:left;font:500 12px/20px var(--font);color:var(--text2);padding:12px 12px;border-bottom:1px solid #B9C6CC;white-space:nowrap}
.tcard td{padding:14px 12px;border-bottom:1px solid #DDE3E6;vertical-align:middle}
.tcard tbody tr{cursor:pointer}
.tcard tbody tr:hover td{background:#F4F7F9}
.tcard td b{font-weight:500;display:block}
.tcard td small{display:block;color:var(--text2);font-size:12px}
.empty{padding:48px 16px;text-align:center;color:var(--text2)}
.mcards{display:none}

/* ---------- Detail extras ---------- */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px;margin-top:16px}
.kv div span{display:block;font:400 12px/20px var(--font);color:var(--text2)}
.kv div b{font:400 14px/20px var(--font)}
.timeline{list-style:none;margin:16px 0 0;padding:0;display:flex;gap:0}
.timeline li{flex:1;position:relative;padding-top:28px;font:400 12px/20px var(--font);color:var(--text2)}
.timeline li::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:#B9C6CC}
.timeline li:first-child::before{left:8px}
.timeline li .pt{position:absolute;top:0;left:0;width:18px;height:18px;border-radius:9px;background:var(--col);border:2px solid #B9C6CC}
.timeline li.done::before{background:var(--charcoal)}
.timeline li.done .pt{background:var(--charcoal);border-color:var(--charcoal)}
.timeline li.now .pt{background:var(--white);border-color:var(--orange)}
.timeline li b{display:block;color:var(--text);font-weight:500}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0}
.sec-title h2{margin:0;font:500 16px/24px var(--font)}
.comms{flex:1 1 50%;min-height:0;display:flex;flex-direction:column}
.comms .scroll{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-right:4px}
.evt{background:var(--white);border-radius:12px;padding:10px 12px;font:400 12px/20px var(--font)}
.evt b{font-weight:500;display:block;font-size:14px}
.evt time{color:var(--text2)}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;font:400 12px/20px var(--font);background:var(--white)}
.msg.me{align-self:flex-end;background:#FCE6DA}
.msg .who{font-weight:500;display:block}
.composer{display:flex;gap:8px;margin-top:8px}
.composer .fbox{flex:1;min-height:40px;padding:0 12px;background:var(--white)}
.composer .fbox input{font-size:14px}

/* ---------- Evidence ---------- */
.ws-list{display:flex;flex-direction:column;gap:6px}
.ws{width:100%;text-align:left;padding:10px 12px;border-radius:12px;font:400 12px/20px var(--font);color:var(--text2)}
.ws b{display:block;font:500 14px/20px var(--font);color:var(--text)}
.ws:hover{background:rgba(101,137,154,.12)}
.ws.on{background:var(--nav-active)}
.ws-ic{display:none}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--sub);border-radius:12px;padding:10px 16px;min-width:140px}
.stat b{display:block;font:400 24px/36px var(--font)}
.stat span{font:400 12px/20px var(--font);color:var(--text2)}
.ctl-group{margin-top:20px}
.ctl-group h3{margin:0 0 8px;font:500 14px/20px var(--font);color:var(--text2)}
.ctl{background:var(--white);border-radius:12px;margin-bottom:8px}
.ctl-h{width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px;text-align:left}
.ctl-h .code{font:500 14px/20px var(--font);width:64px;flex:none}
.ctl-h .ttl{flex:1;min-width:0}
.ctl-h .ttl small{display:block;font:400 12px/20px var(--font);color:var(--text2)}
.ctl-b{padding:0 16px 16px 96px}
.ctl-b p{margin:0 0 8px;color:var(--text2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--field);border-radius:14px;padding:2px 10px;font:400 12px/20px var(--font)}
@container (max-width:835px){ .ctl-b{padding-left:16px} .kv{grid-template-columns:repeat(2,minmax(0,1fr))} .meta-bar{flex-direction:column;align-items:flex-start;gap:4px} }

/* ---------- Passport ---------- */
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cert{background:var(--white);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cert-top{display:flex;gap:12px;align-items:flex-start}
.seal{width:48px;height:48px;border-radius:24px;background:var(--charcoal);color:#fff;display:grid;place-items:center;flex:none}
.cert h3{margin:0;font:500 16px/24px var(--font)}
.cert .kv{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0}
.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;border-top:1px solid #E1E6E9;padding-top:12px}
.sw{width:44px;height:24px;border-radius:12px;background:#B9C6CC;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--orange)}
.sw[aria-checked="true"]::after{left:23px}
.sw[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.panel{background:var(--white);border-radius:16px;padding:20px 24px;margin-top:20px;overflow-x:auto}
.panel h2{margin:0;font:500 20px/28px var(--font)}
.panel table{width:100%;border-collapse:collapse;margin-top:12px;min-width:640px}
.panel th{text-align:left;font:500 12px/20px var(--font);color:var(--text2);padding:8px 12px;border-bottom:1px solid #B9C6CC}
.panel td{padding:10px 12px;border-bottom:1px solid #E1E6E9}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.bdg{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 14px}
.bdg .seal{width:40px;height:40px;background:var(--burgundy)}
.bdg b{display:block;font-weight:500}
.bdg span{font:400 12px/20px var(--font);color:var(--text2)}

/* ---------- Login ---------- */
.login{min-height:100dvh;background:linear-gradient(100deg,#FF9966 0%,#E9C5B3 38%,#C9D3D8 72%,#A3B8C2 100%)}
.login .app{height:auto;min-height:100dvh}
.login-body{flex:1;display:grid;grid-template-columns:1fr 29% 1fr;gap:4%;align-items:center;padding:48px 0}
.login-intro{grid-column:1;color:var(--text)}
.login-intro h1{margin:0 0 16px;font:400 36px/52px var(--font);max-width:14ch}
.login-intro p{margin:0;max-width:44ch;font:400 16px/24px var(--font);color:var(--text2)}
.login-card{grid-column:2;background:rgba(255,255,255,.92);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;min-width:360px}
.login-card h2{margin:0;font:400 24px/36px var(--font)}
.login-card .fld{width:clamp(296px,100%,448px)}
.login-card .fbox{background:var(--field)}
.login-card .btn{width:100%;height:48px;border-radius:24px}
.login-foot{font:400 12px/20px var(--font);color:var(--text2)}
.login-side{grid-column:3;display:flex;flex-direction:column;gap:12px}
.login-side .step{background:rgba(255,255,255,.55);border-radius:16px;padding:14px 16px}
.login-side .step b{display:block;font-weight:500}
.login-side .step span{font:400 12px/20px var(--font);color:var(--text2)}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,55,62,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--white);border-radius:24px;padding:24px;width:min(560px,100%);max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font:400 24px/36px var(--font)}
.modal .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:8px}
.modal .fld{width:100%}
.modal .btn-ghost{height:40px;border-radius:20px;padding:0 20px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center}
.checks input{accent-color:var(--orange);width:18px;height:18px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font:400 14px/20px var(--font)}
.linkbox code{flex:1;font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#28373E;color:#fff;border-radius:8px;padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:60;box-shadow:0 3px 12px rgba(0,0,0,.2);max-width:min(560px,calc(100% - 32px))}
.snack button{color:#FFB38A;font-weight:500}
.pop{position:fixed;z-index:55;background:var(--white);border-radius:12px;box-shadow:0 4px 20px rgba(40,55,62,.22);padding:6px;min-width:200px}
.pop button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;border-radius:8px;text-align:left}
.pop button:hover{background:var(--bg)}
.pop button.danger{color:var(--red)}
.notif{width:360px;padding:12px}
.notif h3{margin:4px 8px 8px;font:500 16px/24px var(--font)}
.notif .n{display:block;padding:10px 12px;border-radius:10px;text-align:left;width:100%}
.notif .n.unread{background:#FFF1EA}
.notif .n b{display:block;font-weight:500}
.notif .n span{font:400 12px/20px var(--font);color:var(--text2)}

/* ---------- Mobile bits ---------- */
.mnav{display:none}
.m-note{display:none}

/* ================= Breakpoints ================= */
/* 1280–1439 small desktop: icon nav, 12px gaps, comm column → 260 */
@media (max-width:1439px){
  :root{--gap:12px;--head-gap:20px}
  .sr-grid{grid-template-columns:88px minmax(0,1fr) clamp(260px,19.7vw,284px)}
  .col-left{padding:12px 4px}
  .vnav a{flex-direction:column;gap:2px;padding:8px 4px;text-align:center;font:500 12px/16px var(--font);position:relative;border-radius:12px}
  .vnav .ic{display:block}
  .vnav a.on{background:transparent}
  .vnav a.on .ic{background:var(--nav-active);border-radius:12px;width:40px;height:28px;padding:2px 8px}
  .vnav .dot,.vnav .ok{position:absolute;top:6px;right:14px;margin:0}
  .vnav .ok{width:14px;height:14px}
  .ws{padding:8px 4px;text-align:center}
  .ws b{font-size:12px;line-height:16px}
  .ws small{display:none}
}
/* 1178–1279 big horizontal tablet: icon buttons in header & top bar */
@media (max-width:1279px){
  .phead .acts .btn{width:40px;padding:0}
  .phead .acts .btn span{display:none}
  .phead .acts .ic{display:block}
  .tb-link span{display:none}
  .tb-link .ic{display:block}
  .tb-link{padding:8px;border-radius:50%}
  .autosave span{display:none}
  .phead > .tag .si{display:none}
  .phead > .tag .long{display:none}
  .phead > .tag .short{display:inline!important}
}
/* 768–1177 small vertical tablet */
@media (max-width:1177px){
  :root{--gap:8px;--pad-card:16px;--pad-right:12px}
  .app{min-width:768px}
  .sr-grid{grid-template-columns:80px minmax(0,1fr) clamp(206px,22vw,259px)}
  .login-body{grid-template-columns:1fr 1fr;}
  .login-side{display:none}
  .login-card{grid-column:2}
}
/* < 768 mobile (consult only) */
@media (max-width:767px){
  .app{min-width:320px;height:auto;min-height:100dvh}
  .main-scroll{overflow:visible;padding-bottom:112px}
  .topbar{display:none}
  .home-head{padding:16px 0 12px}
  .toolbar{flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0;background:var(--bg)}
  .search{width:100%}
  .filter,.toolbar .btn{display:none}
  .tcard{display:none}
  .mcards{display:flex;flex-direction:column;gap:8px}
  .mc{background:var(--white);border-radius:12px;padding:14px 16px;position:relative;text-align:left;width:100%}
  .mc b{font-weight:500;display:block}
  .mc .s{font:400 12px/20px var(--font);color:var(--text2)}
  .mc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:10px}
  .mc .g span{display:block;font:400 12px/20px var(--font);color:var(--text2)}
  .mc .tag{margin-top:8px}
  .mnav{display:flex;position:fixed;left:12px;right:84px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;border-radius:28px;background:#E3EAEE;box-shadow:0 2px 10px rgba(40,55,62,.18);align-items:center;justify-content:center;gap:16px;z-index:20}
  .fab{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--orange);color:#fff;display:grid;place-items:center;z-index:20;box-shadow:0 2px 10px rgba(40,55,62,.25)}
  .sr-grid{display:flex;flex-direction:column}
  .col-left{display:none}
  .col-mid{overflow:visible}
  .phead{flex-wrap:wrap;gap:12px}
  .phead .acts{display:none}
  .m-note{display:block;background:var(--yellow-bg);border-radius:12px;padding:12px 16px;margin-bottom:8px}
  .kv{grid-template-columns:1fr 1fr}
  .timeline{flex-direction:column;gap:12px}
  .timeline li{padding:0 0 0 28px}
  .timeline li::before{display:none}
  .login-body{grid-template-columns:1fr;padding:24px 0}
  .login-intro{display:none}
  .login-card{grid-column:1;min-width:0}
  .login-card .fld{width:100%}
  .pp-grid{grid-template-columns:1fr}
  .snack{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:411px){
  .search input::placeholder{color:transparent}
  .mc .tag .txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ============ Fields ============ */
function fld(o){
 const id=o.id, v=o.value??'';
 const lab=`<label for="${id}">${esc(o.label)}${o.req?' <span class="req">*</span>':''}</label>`;
 let inner;
 if(o.options){
  const opts=o.options.map(x=>Array.isArray(x)?`<optgroup label="${esc(x[0])}">${x[1].map(y=>`<option ${y===v?'selected':''}>${esc(y)}</option>`).join('')}</optgroup>`:`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  inner=`<div class="fbox sel">${lab}<select id="${id}" data-f="${o.f||id}" ${o.req?'required':''}><option value="" disabled ${v?'':'selected'} hidden>${esc(o.ph||'Select…')}</option>${opts}</select><span class="chev">${ic('down')}</span></div>`;
 }else if(o.type==='textarea'){
  inner=`<div class="fbox">${lab}<textarea id="${id}" data-f="${o.f||id}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea></div>`;
 }else{
  inner=`<div class="fbox">${lab}<input id="${id}" data-f="${o.f||id}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.min?`min="${o.min}"`:''} ${o.inputmode?`inputmode="${o.inputmode}"`:''} autocomplete="${o.ac||'off'}"></div>`;
 }
 const msg=o.err?`<div class="err" id="${id}-m" role="alert">${esc(o.err)}</div>`:(o.help?`<div class="help" id="${id}-m">${o.help}</div>`:'');
 return `<div class="fld ${o.w||'w-m'} ${o.options?'dd':''} ${o.err?'has-err':''}" data-help="${esc(o.help||'')}">${inner}${msg}</div>`;
}

function missing(d){

function render(){

/* ============ Overlays ============ */
let snackT;
function snack(msg,action){
 document.querySelectorAll('.snack').forEach(n=>n.remove());
 const n=document.createElement('div');n.className='snack';n.setAttribute('role','status');
 n.innerHTML=`<span>${esc(msg)}</span>${action?`<button data-act="${action[1]}" data-id="${action[2]||''}">${esc(action[0])}</button>`:''}`;
 document.body.appendChild(n);clearTimeout(snackT);snackT=setTimeout(()=>n.remove(),4500);
}
let lastFocus=null;
function modal(html,onSubmit){
 closeModal(true); lastFocus=document.activeElement;
 const s=document.createElement('div');s.className='scrim';s.id='scrim';
 s.innerHTML=`<form class="modal" role="dialog" aria-modal="true" novalidate>${html}</form>`;
 document.body.appendChild(s);
 s.addEventListener('mousedown',e=>{if(e.target===s)closeModal()});
 s.querySelector('form').addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(e.target),e.target)!==false)closeModal()});
 setTimeout(()=>(s.querySelector('input:not([type=hidden]),select,textarea,button')||s).focus(),30);
}
function closeModal(silent){const s=$('#scrim');if(s){s.remove();if(!silent&&lastFocus)lastFocus.focus()}}
function pop(anchor,html){
 closePop();const p=document.createElement('div');p.className='pop';p.id='pop';p.innerHTML=html;document.body.appendChild(p);
 const r=anchor.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
 let left=Math.min(r.right-w,innerWidth-w-8);left=Math.max(8,left);let top=r.bottom+6;if(top+h>innerHeight-8)top=r.top-h-6;
 p.style.left=left+'px';p.style.top=Math.max(8,top)+'px';
 const b=p.querySelector('button');b&&b.focus();
}

   fd=>{const sel=fd.getAll('ev');sel.forEach(f=>{const e=lib.find(x=>x.file===f);ctl.ev.push({...e,id:nid('e')})});render();if(sel.length)snack(`${sel.length} evidence mapped to ${code}`)})},
 unmap:(el,id)=>{closePop();const [e,c]=findEv(id);c.ev=c.ev.filter(x=>x.id!==id);render();snack(`Mapping removed from ${c.c}. The file stays in your library.`)},
 sw:(el,id)=>{const c=S.certs.find(x=>x.id===id);if(c.status!=='Active'){snack('Only issued certificates can be shared.');return}c.share=!c.share;el.setAttribute('aria-checked',c.share);snack(c.share?`${c.fw} is now visible on shared links`:`${c.fw} is hidden from shared links`)},
 share:()=>modal(`<h2>Create share link</h2>
  ${fld({id:'m-to',label:'Shared with',req:true,ph:'e.g. Customer name — team',w:'',help:'Only you and your Customer Admins see this label.'})}
  ${fld({id:'m-exp',label:'Link expires after',options:['7 days','30 days','90 days'],value:'30 days',w:''})}
  <fieldset style="border:0;padding:0;margin:0"><legend class="help" style="padding:0 0 6px">Include</legend><div class="checks">${S.certs.filter(c=>c.status==='Active').map(c=>`<label><input type="checkbox" name="c" value="${c.id}" ${c.share?'checked':''}> ${esc(c.fw)} · ${esc(c.no)}</label>`).join('')}<label><input type="checkbox" name="b" checked> Training badges</label></div></fieldset>
  <div class="foot"><button class="btn btn-ghost" type="button" data-act="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Create link</button></div>`,
  (fd,form)=>{const to=form.querySelector('#m-to').value.trim();if(!to){const f=form.querySelector('#m-to').closest('.fld');f.classList.add('has-err');f.querySelector('.help,.err').className='err';f.querySelector('.err').textContent='Add who you are sharing with.';return false}
   const days=parseInt(form.querySelector('#m-exp').value)||30;const d=new Date(today);d.setDate(d.getDate()+days);
   const tok=Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
   const l={id:nid('l'),to,url:'https://trust.sgs.com/p/'+tok,exp:d.toISOString().slice(0,10),views:0,on:true};S.links.unshift(l);
   setTimeout(()=>{render();modal(`<h2>Link ready</h2><p style="margin:0">Anyone with this link can view the selected certificates until ${fmt(l.exp)}. You can revoke it at any time.</p><div class="linkbox"><code>${l.url}</code><button class="icon-btn" type="button" data-act="copy" data-id="${l.url}" aria-label="Copy link">${ic('copy','sm')}</button></div><div class="foot"><button class="btn btn-ghost" type="button" data-act="preview">Preview</button><button class="btn btn-dark" type="submit">Done</button></div>`,()=>{})},0)}),
 copy:(el,id)=>{try{navigator.clipboard.writeText(id)}catch(_){}snack('Link copied')},
 revoke:(el,id)=>{const l=S.links.find(x=>x.id===id);l.on=false;render();snack('Link revoked. It no longer opens.')},
 preview:()=>{closeModal(true);go('#/shared')}
};
function saveDraft(status){
 const d=S.draft;const existing=S.srs.find(x=>x.id===d.id);
 const rec=Object.assign(existing||{},JSON.parse(JSON.stringify(d)),{status,updated:today});delete rec.existing;
 rec.comms=rec.comms||[];rec.messages=rec.messages||[];
 if(!existing)S.srs.unshift(rec);
 return rec;
}
/* inputs */
document.addEventListener('input',e=>{
 const fl=e.target.closest('.fld');
 if(fl&&fl.classList.contains('has-err')){fl.classList.remove('has-err');const m=fl.querySelector('.err');if(m){if(fl.dataset.help){m.className='help';m.innerHTML=fl.dataset.help}else m.remove()}}
 const f=e.target.dataset.f; if(!f||e.target.closest('#scrim')) return;
 if(f==='q'){S.q=e.target.value;const r=tableRows();$('#rows').innerHTML=r.t;$('#mrows').innerHTML=r.m;return}
 if(S.draft&&location.hash.startsWith('#/sr')&&f in S.draft&&e.target.tagName!=='SELECT'){S.draft[f]=e.target.value;refreshDraftMeta()}
});
document.addEventListener('change',e=>{
 const f=e.target.dataset.f; if(!f||e.target.closest('#scrim')) return;
 if(f==='filter'){S.filter=e.target.value;const r=tableRows();$('#rows').innerHTML=r.t;$('#mrows').innerHTML=r.m;return}
 if(f==='owner'){const code=e.target.id.replace('own-c-'+S.activeWs,'');const c=findCtl(code);c.owner=e.target.value;const m=$('#mid'),y=m.scrollTop;render();$('#mid').scrollTop=y;snack(`${e.target.value} now owns ${code}`);return}
 if(S.draft&&location.hash.startsWith('#/sr')&&f in S.draft){
  S.draft[f]=e.target.value;
  if(f==='standard'){S.draft.type=S.draft.category==='Certification'?S.draft.type:'';rerenderMid()} else refreshDraftMeta();
 }
});
document.addEventListener('submit',e=>{
 const k=e.target.dataset.form; if(!k) return; e.preventDefault();
 if(k==='login'){const em=$('#email').value.trim(),pw=$('#pw').value;S.lerr={};
  if(!/^\S+@\S+\.\S+$/.test(em))S.lerr.email='Enter the email address you were invited with.';
  if(!pw)S.lerr.pw='Enter your password.';
  if(Object.keys(S.lerr).length){$('#root').innerHTML=viewLogin();($('.has-err input'))?.focus();return}
  S.lerr=null;go('#/home')}
 if(k==='msg'){const r=S.srs.find(x=>x.id===e.target.dataset.id);const v=$('#msgin').value.trim();if(!v)return;r.messages.push({me:true,who:'You',b:v,d:'Now'});
  const box=$('#msgs');box.innerHTML=r.messages.map(m=>`<div class="msg ${m.me?'me':''}"><span class="who">${esc(m.who)} · ${esc(m.d)}</span>${esc(m.b)}</div>`).join('');box.scrollTop=box.scrollHeight;$('#msgin').value='';snack('Message sent to SGS')}
});
/* scroll-spy for left nav on the draft page */
document.addEventListener('scroll',e=>{
 if(e.target.id!=='mid'||!S.draft||!location.hash.startsWith('#/sr/new'))return;
 const m=e.target;let idx=0;SECS.forEach(([id],i)=>{const t=document.getElementById(id);if(t&&t.offsetTop-m.offsetTop-80<=m.scrollTop)idx=i});
 if(idx!==S.navOn){S.navOn=idx;document.querySelectorAll('#lnav a').forEach((a,i)=>a.classList.toggle('on',i===idx))}
},true);
render();
</script>
</body>

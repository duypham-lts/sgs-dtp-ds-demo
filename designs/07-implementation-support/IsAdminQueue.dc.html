<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SGS Admin – Implementation Support queue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="sgs-ops" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" tone="dark" site-name="Digital Trust Platform" site-sub="Operations Console" badge="Internal" home-links="{{noLinks}}" user-name="Minh Nguyen" user-email="minh.nguyen@sgs.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" tone="dark" label="SGS Operations" sections="{{nav}}" default-active="req-impl" default-collapsed="{{collapsed}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">Implementation Support requests</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Approve and assign a consultant, or reject with a reason.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px"><x-import component-from-global-scope="Graphite.Tabs" label="Request status" tabs="{{tabs}}"></x-import></section>
    </main>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite, F = window.React.Fragment;

    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' },
      { id: 'req', label: 'Requests', icon: 'task', badge: 3, badgeTone: 'attention', badgeLabel: 'requests need triage', children: [
        { id: 'req-all', label: 'All requests' }, { id: 'req-cert', label: 'Certification' }, { id: 'req-train', label: 'Training' },
        { type: 'label', label: 'Other services' }, { id: 'req-gap', label: 'Gap Analysis', badge: 3, badgeTone: 'attention', badgeLabel: 'need triage' }, { id: 'req-impl', label: 'Implementation Support' } ] },
      { id: 'cust', label: 'Customers', icon: 'user--multiple' },
      { id: 'fw', label: 'Frameworks', icon: 'catalog' },
      { id: 'asg', label: 'Assignments', icon: 'user--access' },
      { id: 'audit', label: 'Audit Logs', icon: 'document' },
      { id: 'settings', label: 'Settings', icon: 'settings' } ] }];
    var extra = {};

    function R(a){ return { id: a[0], cust: a[1], fw: a[2], scope: a[3], sub: a[4], cons: a[5] || '—', st: a[6], ga: a[7] || '—' }; }
    var ST = { submitted: ['under-review', 'Submitted'], progress: ['info', 'In progress'], completed: ['completed', 'Completed'], rejected: ['rejected', 'Rejected'] };
    var todo = [['IS-2026-004', 'ABC Trading Co., Ltd.', 'ISO/IEC 27701', 'Customer data platform', '22 Sep 2026', '', 'submitted'], ['IS-2026-005', 'Lotus Cosmetics JSC', 'ISO/IEC 27001', 'Bac Ninh plant', '23 Sep 2026', '', 'submitted', 'GA-2026-007']].map(R);
    var prog = [['IS-2026-003', 'ABC Trading Co., Ltd.', 'ISO/IEC 27001', 'Head office · Taipei', '05 Oct 2026', 'Anna Lee', 'progress', 'GA-2026-002']].map(R);
    var closed = [['IS-2026-001', 'ABC Trading Co., Ltd.', 'TISAX', 'Plant · Taichung', '20 Jan 2026', 'Wei Lin', 'completed'], ['IS-2025-009', 'ABC Trading Co., Ltd.', 'ISO 22301', 'Head office · Taipei', '02 Dec 2025', '', 'rejected']].map(R);
    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', { style: { fontWeight: 500 } }, a), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b)); }
    var cols = [
      { key: 'id', header: 'Request', sortable: true, width: 130, render: function(r){ return h('a', { href: r.id === 'IS-2026-004' ? 'IsAdminReview.dc.html' : '#', className: 'gr-link', style: { fontWeight: 500 } }, r.id); } },
      { key: 'cust', header: 'Customer · scope', sortable: true, render: function(r){ return two(r.cust, r.scope); } },
      { key: 'fw', header: 'Framework', sortable: true },
      { key: 'sub', header: 'Submitted', sortable: true },
      { key: 'cons', header: 'Consultant' },
      { key: 'st', header: 'Status', render: function(r){ return h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }); } } ];
    function T(rows, acts){ return h(G.DataTable, { columns: cols, rows: rows, layout: 'table', searchable: true, searchPlaceholder: 'Search requests or customers', rowActions: function(){ return acts; } }); }
    extra.crumbs = [{ label: 'Requests', href: '#' }, { label: 'Implementation Support' }];
    extra.tabs = [
      { id: 'todo', label: 'To review', badge: todo.length, content: T(todo, [{ label: 'Review' }, { label: 'Approve & assign' }, { label: 'Reject', danger: true }]) },
      { id: 'prog', label: 'In progress', badge: prog.length, content: T(prog, [{ label: 'Open' }]) },
      { id: 'closed', label: 'Closed', badge: closed.length, content: T(closed, [{ label: 'Open' }]) } ];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav, noLinks: [], noop: function(){}, collapsed: false }, extra);
  }
}
</script>
</body>
</html>

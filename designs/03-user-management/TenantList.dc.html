<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SGS Admin – customers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="sgs-ops" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" tone="dark" site-name="Digital Trust Platform" site-sub="Operations Console" badge="Internal" home-links="{{noLinks}}" user-name="Minh Nguyen" user-email="minh.nguyen@sgs.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" tone="dark" label="SGS Operations" sections="{{nav}}" default-active="cust" default-collapsed="{{collapsed}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 8px 8px 4px">
        <div>
          <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
          <h1 class="headline-medium" style="margin: 8px 0 0 0">Customers</h1>
          <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Customer accounts of SGS Taiwan. Each has one Customer Admin, who invites and manages the rest of their team.</p>
        </div>
        <x-import component-from-global-scope="Graphite.Button" size="md" icon="add" icon-position="left">Create customer</x-import>
      </div>
      <div style="flex-grow: 1; min-height: 0"><x-import component-from-global-scope="Graphite.DataTable" title="{{count}}" columns="{{cols}}" rows="{{rows}}" searchable="{{yes}}" search-placeholder="Search customers" layout="table"></x-import></div>
    </main>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite, F = window.React.Fragment;

    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' },
      { id: 'req', label: 'Requests', icon: 'task', badge: 3, badgeTone: 'attention', badgeLabel: 'requests need triage', children: [
        { id: 'req-all', label: 'All requests' }, { id: 'req-cert', label: 'Certification' }, { id: 'req-train', label: 'Training' },
        { type: 'label', label: 'Other services' }, { id: 'req-gap', label: 'Gap Analysis', badge: 3, badgeTone: 'attention', badgeLabel: 'need triage' }, { id: 'req-impl', label: 'Implementation Support' } ] },
      { id: 'cust', label: 'Customers', icon: 'category' },
      { id: 'fw', label: 'Frameworks', icon: 'catalog' },
      { id: 'asg', label: 'Assignments', icon: 'user--access' },
      { id: 'audit', label: 'Audit Logs', icon: 'document' },
      { id: 'settings', label: 'Settings', icon: 'settings' } ] },
      { label: 'Administration', items: [{ id: 'users', label: 'Users', icon: 'user--multiple' }] }];
    var extra = {};

    var ST = { active: ['completed', 'Active'], invited: ['under-review', 'Admin invited'], noadmin: ['draft', 'No admin yet'] };
    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', { style: { fontWeight: 500 } }, a), b ? h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b) : null); }
    var rows = [
      { id: 't1', name: 'ABC Trading Co., Ltd.', country: 'Taiwan', admin: 'Linh Tran', email: 'linh.tran@abc-trading.com', users: 6, scopes: 4, st: 'active', created: '12 Mar 2025', href: 'TenantDetail.dc.html' },
      { id: 't2', name: 'Formosa Chips Inc.', country: 'Taiwan', admin: 'Chen Wei-Ting', email: 'wt.chen@formosachips.com', users: 9, scopes: 3, st: 'active', created: '04 Jun 2025', href: '#' },
      { id: 't3', name: 'Lotus Cosmetics JSC', country: 'Vietnam', admin: 'Nguyen Thi Ha', email: 'ha.nguyen@lotus.vn', users: 1, scopes: 0, st: 'invited', created: '24 Sep 2026', href: '#' },
      { id: 't4', name: 'Riyadh Imports LLC', country: 'Saudi Arabia', admin: '', email: '', users: 0, scopes: 0, st: 'noadmin', created: 'Today', href: 'TenantNew.dc.html' } ];
    var extra = { rows: rows, count: rows.length + ' customers', crumbs: [{ label: 'Customers' }] };
    extra.cols = [
      { key: 'name', header: 'Customer', sortable: true, render: function(r){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('a', { href: r.href, className: 'gr-link', style: { fontWeight: 500 } }, r.name), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, r.country)); }, searchValue: function(r){ return r.name + ' ' + r.admin + ' ' + r.email; } },
      { key: 'admin', header: 'Customer Admin', render: function(r){ return r.admin ? two(r.admin, r.email) : h(G.Button, { variant: 'tertiary', size: 'sm', icon: 'add', iconPosition: 'left' }, 'Create admin'); } },
      { key: 'users', header: 'Users', align: 'end', width: 100, sortable: true },
      { key: 'scopes', header: 'Scopes', align: 'end', width: 100, sortable: true },
      { key: 'st', header: 'Status', width: 170, render: function(r){ return h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }); } },
      { key: 'created', header: 'Created', width: 130 } ];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav, noLinks: [], noop: function(){}, collapsed: false }, extra);
  }
}
</script>
</body>
</html>

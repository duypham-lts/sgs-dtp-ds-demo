<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer Admin – invite a user</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="customer" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" site-name="Digital Trust Platform" site-sub="Customer Portal" user-name="Linh Tran" user-email="linh.tran@abc-trading.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" label="Customer Portal" sections="{{nav}}" default-active="users" default-collapsed="{{no}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">Users</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">People in ABC Trading Co., Ltd. who can use the Customer Portal.</p>
      </div>
      <div style="flex-grow: 1; min-height: 0"><x-import component-from-global-scope="Graphite.DataTable" title="{{usersTitle}}" columns="{{cols}}" rows="{{rows}}" searchable="{{yes}}" search-placeholder="Search name or email" toolbar-actions="{{inviteBtn}}" row-actions="{{rowActions}}" layout="table"></x-import></div>
    </main>
  </div>
  <x-import component-from-global-scope="Graphite.Modal" inline="{{yes}}" open="{{yes}}" size="fit" title="Invite a user" on-close="{{noop}}" primary-action="{{primary}}" secondary-action="{{secondary}}">
    <div style="display: flex; flex-direction: column; gap: 16px; width: 552px; max-width: 100%">
            <p class="body-medium" style="margin: 0; color: var(--text-secondary)">They join ABC Trading Co., Ltd. as a Customer User and get an email to activate their account.</p>
      <x-import component-from-global-scope="Graphite.TextInput" label="Email" type="email" required="{{yes}}" size="l" default-value="kevin.ho@abc-trading.com" help-text="The invitation is sent here. It becomes their sign-in name."></x-import>
      <x-import component-from-global-scope="Graphite.TextInput" label="Full name (optional)" size="l" default-value="Kevin Ho"></x-import>
      <x-import component-from-global-scope="Graphite.MultiSelect" label="Scope access (optional)" width="552px" placeholder="No scopes yet" default-value="{{scopeSel}}" options="{{scopes}}" help-text="They can only see the scopes you choose. You can change this later."></x-import>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite;

    var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
      { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },
      { type: 'label', label: 'Other services' }, { id: 'sr-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'needs action' }, { id: 'sr-impl', label: 'Implementation Support' } ] };
    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' }, { id: 'scopes', label: 'Scopes', icon: 'category' }, { id: 'ws', label: 'Workspaces', icon: 'folders' },
      { id: 'docs', label: 'Documents', icon: 'document--multiple-01' }, SR, { id: 'training', label: 'Training', icon: 'education' },
      { id: 'audit', label: 'Audit Logs', icon: 'catalog' }, { id: 'settings', label: 'Settings', icon: 'settings' } ] },
      { label: 'Administration', items: [{ id: 'users', label: 'Users', icon: 'user--multiple' }, { id: 'access', label: 'Workspace access', icon: 'user--access' }] }];

    var ST = { active: ['completed', 'Active'], invited: ['under-review', 'Invitation pending'], expired: ['missing-info', 'Invitation expired'], inactive: ['draft', 'Deactivated'] };
    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', { style: { fontWeight: 500 } }, a), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b)); }
    var rows = [{"id": "u1", "name": "Linh Tran", "email": "linh.tran@abc-trading.com", "role": "Customer Admin", "st": "active", "scopes": "All scopes", "last": "Today, 09:12", "href": "CaUserDetail.dc.html"}, {"id": "u2", "name": "Wei Chen", "email": "wei.chen@abc-trading.com", "role": "Customer User", "st": "active", "scopes": "2 scopes", "last": "Yesterday", "href": "CaUserDetail.dc.html"}, {"id": "u3", "name": "Mei Lin", "email": "mei.lin@abc-trading.com", "role": "Customer User", "st": "active", "scopes": "1 scope", "last": "18 Sep 2026", "href": "#"}, {"id": "u4", "name": "Kevin Ho", "email": "kevin.ho@abc-trading.com", "role": "Customer User", "st": "invited", "scopes": "1 scope", "last": "\u2014", "href": "CaUserPending.dc.html"}, {"id": "u5", "name": "Jason Wu", "email": "jason.wu@abc-trading.com", "role": "Customer User", "st": "expired", "scopes": "\u2014", "last": "\u2014", "href": "#"}, {"id": "u6", "name": "Amy Chou", "email": "amy.chou@abc-trading.com", "role": "Customer User", "st": "inactive", "scopes": "\u2014", "last": "02 Jun 2026", "href": "#"}];
    var extra = { crumbs: [{ label: 'Administration', href: '#' }, { label: 'Users' }] };
    extra.rows = rows;
    extra.cols = [
      { key: 'name', header: 'User', sortable: true, render: function(r){ return h('span', { style: { display: 'flex', alignItems: 'center', gap: 12 } }, h(G.Avatar, { name: r.name, size: 'md' }), h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('a', { href: r.href, className: 'gr-link', style: { fontWeight: 500 } }, r.name), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, r.email))); }, searchValue: function(r){ return r.name + ' ' + r.email; } },
      { key: 'role', header: 'Role', sortable: true, width: 170 },
      { key: 'scopes', header: 'Scope access', width: 150 },
      { key: 'st', header: 'Status', sortable: true, width: 190, sortValue: function(r){ return ST[r.st][1]; }, render: function(r){ return h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }); } },
      { key: 'last', header: 'Last sign-in', width: 150 } ];
    extra.rowActions = function(r){ return r.st === 'invited' || r.st === 'expired' ? [{ label: 'View' }, { label: 'Resend invitation' }, { label: 'Revoke invitation', danger: true }] : [{ label: 'View' }, { label: 'Assign scopes', disabled: r.role === 'Customer Admin' }]; };
    extra.inviteBtn = h(G.Button, { size: 'md', icon: 'add', iconPosition: 'left' }, 'Invite user');
    extra.noop = function(){}; extra.two = 2; extra.primary = { label: 'Send invitation' }; extra.secondary = { label: 'Cancel' };
    extra.scopes = [{ value: 'hq', label: 'Head office · Taipei', description: 'Organisation scope · ISO/IEC 27001, ISO 22301' }, { value: 'tc', label: 'Plant · Taichung', description: 'Site scope · TISAX' }, { value: 'ai', label: 'AI platform', description: 'Product scope · ISO/IEC 42001' }, { value: 'cdp', label: 'Customer data platform', description: 'System scope · ISO/IEC 27701' }];
    extra.scopeSel = ['hq'];
    function countLabel(n){ return n + (n === 1 ? ' user' : ' users'); }
    if (typeof rows !== 'undefined') extra.usersTitle = countLabel(rows.length);
    extra.emptyTitle = countLabel((extra.noRows || []).length);
    return Object.assign({ yes: true, no: false, three: 3, nav: nav }, typeof extra === 'object' ? extra : {});
  }
}
</script>
</body>
</html>

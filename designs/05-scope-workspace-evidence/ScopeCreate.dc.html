<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer Admin – create scope</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="customer" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" site-name="Digital Trust Platform" site-sub="Customer Portal" user-name="Linh Tran" user-email="linh.tran@abc-trading.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" label="Customer Portal" sections="{{nav}}" default-active="scopes" default-collapsed="{{no}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 8px 8px 4px">
        <div>
          <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
          <h1 class="headline-medium" style="margin: 8px 0 0 0">Scopes</h1>
          <p class="body-medium" style="margin: 0; color: var(--text-secondary)">The parts of ABC Trading you prepare for a framework: the organisation, a product or a system.</p>
        </div>
        <x-import component-from-global-scope="Graphite.Button" icon="add" icon-position="left">Create scope</x-import>
      </div>
      <div style="flex-grow: 1; min-height: 0"><x-import component-from-global-scope="Graphite.DataTable" title="{{count}}" columns="{{cols}}" rows="{{rows}}" searchable="{{yes}}" search-placeholder="Search scopes" layout="table"></x-import></div>
    </main>
  </div>
  <x-import component-from-global-scope="Graphite.Modal" inline="{{yes}}" open="{{yes}}" size="fit" title="Create scope" on-close="{{noop}}" primary-action="{{primary}}" secondary-action="{{secondary}}">
    <div style="display: flex; flex-direction: column; gap: 16px; width: 640px; max-width: 100%">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend class="label-small" style="color: var(--text-secondary); margin-bottom: 4px">Type <span class="gr-req">*</span></legend>
        <div style="display: flex; gap: 8px">
        <label style="flex: 1; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-01); box-shadow: none; cursor: pointer"><input type="radio" name="stype" class="gr-radio" style="margin-top: 2px"><span style="display: flex; flex-direction: column"><span class="title-small">Organization</span><span class="body-small" style="color: var(--text-secondary)">The whole company or one legal entity</span></span></label>
        <label style="flex: 1; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-01); box-shadow: none; cursor: pointer"><input type="radio" name="stype" class="gr-radio" style="margin-top: 2px"><span style="display: flex; flex-direction: column"><span class="title-small">Product</span><span class="body-small" style="color: var(--text-secondary)">A product or service you offer</span></span></label>
        <label style="flex: 1; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-md); background: var(--background-brand-subtle); box-shadow: inset 0 0 0 1px var(--brand-orange); cursor: pointer"><input type="radio" name="stype" class="gr-radio" checked style="margin-top: 2px"><span style="display: flex; flex-direction: column"><span class="title-small">System</span><span class="body-small" style="color: var(--text-secondary)">One information system; can belong to an organisation and a product</span></span></label>
        </div>
      </fieldset>
      <x-import component-from-global-scope="Graphite.TextInput" label="Name" width="640px" required="{{yes}}" default-value="Customer data platform"></x-import>
      <div style="display: flex; gap: 16px; flex-wrap: wrap">
        <x-import component-from-global-scope="Graphite.Select" label="Belongs to organisation" width="312px" default-value="hq" options="{{orgs}}"></x-import>
        <x-import component-from-global-scope="Graphite.Select" label="Belongs to product (optional)" width="312px" default-value="app" options="{{prods}}"></x-import>
      </div>
      <x-import component-from-global-scope="Graphite.Textarea" label="What is in scope" width="640px" required="{{yes}}" rows="{{two}}" default-value="CRM and loyalty database, APIs for the retail app, hosting in Hsinchu data centre."></x-import>
      <x-import component-from-global-scope="Graphite.Textarea" label="What is out of scope (optional)" width="640px" rows="{{two}}" placeholder="e.g. Marketing email tool run by a supplier"></x-import>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite;

    var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
      { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },
      { type: 'label', label: 'Other services' }, { id: 'sr-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'needs action' }, { id: 'sr-impl', label: 'Implementation Support' } ] };
    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' }, { id: 'scopes', label: 'Scopes', icon: 'category' }, { id: 'ws', label: 'Workspaces', icon: 'folders' },
      { id: 'docs', label: 'Documents', icon: 'document--multiple-01' }, SR, { id: 'training', label: 'Training', icon: 'education' },
      { id: 'audit', label: 'Audit Logs', icon: 'catalog' }, { id: 'settings', label: 'Settings', icon: 'settings' } ] },
      { label: 'Administration', items: [{ id: 'users', label: 'Users', icon: 'user--multiple' }] }];

    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', null, a), b ? h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b) : null); }
    var TT = { Organization: 'neutral', Product: 'info', System: 'required' };
    var rows = [
      { id: 's1', name: 'Head office · Taipei', type: 'Organization', parent: '—', fws: ['ISO/IEC 27001 · 2022'], users: 3, cov: '64%', href: 'ScopeDetail.dc.html' },
      { id: 's2', name: 'Retail loyalty app', type: 'Product', parent: '—', fws: ['ISO/IEC 27701 · 2019'], users: 2, cov: '31%', href: '#' },
      { id: 's3', name: 'Customer data platform', type: 'System', parent: 'Head office · Taipei, Retail loyalty app', fws: ['Appendix 10 · 2022 · Medium'], users: 2, cov: '62%', href: '#' },
      { id: 's4', name: 'AI platform', type: 'Product', parent: '—', fws: [], users: 1, cov: '—', href: '#' } ];
    var extra = { rows: rows, count: rows.length + ' scopes', crumbs: [{ label: 'Scopes' }] };
    extra.cols = [
      { key: 'name', header: 'Scope', sortable: true, render: function(r){ return h('span', { style: { display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-start' } }, h('a', { href: r.href, className: 'gr-link', style: { fontWeight: 500 } }, r.name), h(G.Tag, { tone: TT[r.type] }, r.type)); } },
      { key: 'parent', header: 'Belongs to', width: 240 },
      { key: 'fws', header: 'Frameworks', render: function(r){ return r.fws.length ? h('span', { style: { display: 'flex', flexDirection: 'column' } }, r.fws.map(function(f){ return h('span', { key: f }, f); })) : h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, 'None linked yet'); } },
      { key: 'users', header: 'Users', align: 'end', width: 90 },
      { key: 'cov', header: 'Evidence coverage', align: 'end', width: 160 } ];
    extra.noop = function(){}; extra.two = 2; extra.orgs = [{ value: 'hq', label: 'Head office · Taipei' }]; extra.prods = [{ value: 'none', label: 'None' }, { value: 'app', label: 'Retail loyalty app' }];
    extra.primary = { label: 'Create scope' }; extra.secondary = { label: 'Cancel' };
    return Object.assign({ yes: true, no: false, three: 3, nav: nav }, typeof extra === 'object' ? extra : {});
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer Admin – settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="customer" style="width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" home-links="{{custLinks}}" site-name="Digital Trust Platform" site-sub="Customer Portal" user-name="Linh Tran" user-email="linh.tran@abc-trading.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" label="Customer Portal" sections="{{nav}}" default-active="settings" default-collapsed="{{no}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <h1 class="headline-medium" style="margin: 0">Settings</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Your profile and preferences, and your organisation as held by SGS.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px"><x-import component-from-global-scope="Graphite.Tabs" label="Settings sections" tabs="{{tabs}}" default-tab="org"></x-import></section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite;

    var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
      { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },
      { type: 'label', label: 'Other services' }, { id: 'sr-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'needs action' }, { id: 'sr-impl', label: 'Implementation Support' } ] };
    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' }, { id: 'scopes', label: 'Scopes', icon: 'category' }, { id: 'ws', label: 'Workspaces', icon: 'folders' },
      { id: 'docs', label: 'Documents', icon: 'document--multiple-01' }, { id: 'reviews', label: 'Reviews', icon: 'view', badge: 3, badgeTone: 'attention', badgeLabel: 'items need your response' }, SR, { id: 'certs', label: 'Certifications', icon: 'checkmark' }, { id: 'training', label: 'Training', icon: 'education' },
      { id: 'audit', label: 'Audit Logs', icon: 'catalog' }, { id: 'settings', label: 'Settings', icon: 'settings' } ] },
      { label: 'Administration', items: [{ id: 'users', label: 'Users', icon: 'user--multiple' }] }];

    var extra = {};
    function sect(title, sub, body){ return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, padding: '24px 0', boxShadow: 'inset 0 -1px 0 var(--border-subtle-00)' } }, h('div', { style: { display: 'flex', flexDirection: 'column', gap: 2 } }, h('h2', { className: 'title-medium', style: { margin: 0 } }, title), sub ? h('p', { className: 'body-small', style: { margin: 0, color: 'var(--text-secondary)' } }, sub) : null), body); }
    function col(){ return h.apply(null, ['div', { style: { display: 'flex', flexDirection: 'column', gap: 16, width: 552, maxWidth: '100%' } }].concat([].slice.call(arguments))); }
    var mine = h('div', null,
      sect('Profile', 'Your name is shown to SGS and your team. Email and role are managed by your administrator.', col(
        h(G.TextInput, { label: 'Full name', required: true, width: '552px', defaultValue: 'Linh Tran' }),
        h(G.TextInput, { label: 'Email', width: '552px', defaultValue: 'linh.tran@abc-trading.com', readOnly: true, helpText: 'Your sign-in name. Ask your administrator to change it.' }),
        h(G.TextInput, { label: 'Role', width: '552px', defaultValue: 'Customer Admin', readOnly: true }),
        h(G.TextInput, { label: 'Organisation', width: '552px', defaultValue: 'ABC Trading Co., Ltd.', readOnly: true }),
        h('div', null, h(G.Button, { size: 'md' }, 'Save profile')))),
      sect('Language', 'Applies to the portal and to framework content where a translation exists; otherwise English is shown.', col(
        h(G.Select, { label: 'Display language', width: '552px', defaultValue: 'en', options: [{ value: 'en', label: 'English' }, { value: 'zh', label: '繁體中文 (Traditional Chinese)' }] }))),
      sect('Sign-in', '', col(
        h('p', { className: 'body-medium', style: { margin: 0 } }, 'Your password and sign-in are handled by the SGS sign-in service.'),
        h('div', null, h(G.Button, { variant: 'tertiary', size: 'md' }, 'Sign out')))));
    var org = h('div', null,
      sect('Organisation', 'Maintained by SGS. Contact your SGS team if something is wrong.', h('dl', { className: 'body-medium', style: { margin: 0, display: 'grid', gridTemplateColumns: '200px 1fr', gap: '12px 24px', maxWidth: 720 } },
        h('dt', { style: { color: 'var(--text-secondary)' } }, 'Company name'), h('dd', { style: { margin: 0 } }, 'ABC Trading Co., Ltd.'),
        h('dt', { style: { color: 'var(--text-secondary)' } }, 'Country'), h('dd', { style: { margin: 0 } }, 'Taiwan'),
        h('dt', { style: { color: 'var(--text-secondary)' } }, 'SGS affiliate'), h('dd', { style: { margin: 0 } }, 'SGS Taiwan'),
        h('dt', { style: { color: 'var(--text-secondary)' } }, 'Customer Admin'), h('dd', { style: { margin: 0 } }, 'Linh Tran (you)'),
        h('dt', { style: { color: 'var(--text-secondary)' } }, 'Customer since'), h('dd', { style: { margin: 0 } }, '12 Mar 2025'))),
      sect('Services available to you', 'Set by SGS for your organisation.', h('ul', { style: { listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 8, maxWidth: 720 } },
        [['Certification Services', true], ['Training Courses', true], ['Gap Analysis', true], ['Implementation Support', false]].map(function(x){ return h('li', { key: x[0], style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', borderRadius: 'var(--radius-md)', background: 'var(--layer-02)' } }, h('span', { className: 'body-medium' }, x[0]), h(G.StatusTag, { status: x[1] ? 'completed' : 'draft', size: 'sm', label: x[1] ? 'Available' : 'Not available' })); }))));
    extra.tabs = [{ id: 'me', label: 'My settings', content: mine }, { id: 'org', label: 'Organisation', content: org }];
    extra.custLinks = [{ label: 'Request Applications', icon: 'folder', brand: true, href: '#' }];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav }, typeof extra === 'object' ? extra : {});
  }
}
</script>
</body>
</html>

<div data-theme="sgs-ops" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" tone="dark" site-name="Digital Trust Platform" site-sub="Operations Console" badge="Internal" home-links="{{noLinks}}" user-name="Minh Nguyen" user-email="minh.nguyen@sgs.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" tone="dark" label="SGS Operations" sections="{{nav}}" default-active="audit" default-collapsed="{{collapsed}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">Audit trail</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Every recorded action in SGS Taiwan and its customers — for support, compliance and investigation.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px; gap: 12px">
        <div class="gr-dt__tools" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <x-import component-from-global-scope="Graphite.SearchInput" label="Search events" placeholder="Search person, action or object" size="s" width="280px" value="{{q}}" on-change="{{onQ}}"></x-import>
          <x-import component-from-global-scope="Graphite.Select" label="Action" size="s" width="200px" value="{{cat}}" on-change="{{onCat}}" options="{{cats}}"></x-import>
          <x-import component-from-global-scope="Graphite.Select" label="Customer" size="s" width="200px" value="{{ten}}" on-change="{{onTen}}" options="{{tens}}"></x-import>
          <x-import component-from-global-scope="Graphite.DatePicker" label="From date" placeholder="From" size="s" width="160px" today="2026-10-01" value="{{from}}" on-change="{{onFrom}}"></x-import>
          <x-import component-from-global-scope="Graphite.DatePicker" label="To date" placeholder="To" size="s" width="160px" today="2026-10-01" value="{{to}}" on-change="{{onTo}}"></x-import>
          <x-import component-from-global-scope="Graphite.Button" variant="ghost" size="sm" on-click="{{onClear}}" disabled="{{notFiltered}}">Clear filters</x-import>
        </div>
        <div style="flex-grow: 1; min-height: 0"><x-import component-from-global-scope="Graphite.DataTable" title="{{count}}" description="Recorded once and never changed." columns="{{cols}}" rows="{{rows}}" toolbar-actions="{{exportBtn}}" row-actions="{{rowActions}}" layout="table" page-size="{{eight}}" default-sort="{{sort}}"></x-import></div>
      </section>
    </main>
  </div>

</div>
</x-dc>

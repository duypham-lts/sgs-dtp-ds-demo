        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Book an SGS Academy course for your team. An SGS contact confirms dates and price.</p>

      <section class="gr-card gr-card--extend" style="padding: 16px 24px"><x-import component-from-global-scope="Graphite.Tabs" label="Training Courses" tabs="{{tabs}}"></x-import></section>

        <x-import component-from-global-scope="Graphite.Select" label="Format" required="{{yes}}" size="s" default-value="public" options="{{formats}}"></x-import>
      </div>
      <x-import component-from-global-scope="Graphite.Select" label="Preferred month" required="{{yes}}" size="s" default-value="nov" options="{{months}}"></x-import>
      <x-import component-from-global-scope="Graphite.Select" label="Language" required="{{yes}}" size="s" default-value="zh" options="{{langs}}"></x-import>
      <x-import component-from-global-scope="Graphite.Textarea" label="Message to SGS (optional)" size="l" rows="{{two}}" placeholder="e.g. Participants’ roles, preferred location"></x-import>
    </div>
  </x-import>

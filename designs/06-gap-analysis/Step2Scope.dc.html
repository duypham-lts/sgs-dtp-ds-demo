<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gap Analysis – step 2 scope</title>

<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">

<div data-theme="customer" style="width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">

    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <x-import component-from-global-scope="Graphite.PageHeader" title="New Gap Analysis" subtitle="Step 2 of 5 · Scope" status="{{draft}}" autosave="saved" on-back="{{noop}}" actions="{{hdrActions}}"></x-import>
      <div style="flex-grow: 1; min-height: 0; display: flex; gap: 20px">
        <div style="width: 220px; flex-shrink: 0; box-sizing: border-box; padding: 12px; border-radius: var(--radius-card); background: var(--layer-02)">
          <x-import component-from-global-scope="Graphite.SectionNav" label="Steps" items="{{steps}}" default-active="scope"></x-import>
        </div>
        <div style="flex-grow: 1; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px">
          <section class="gr-card gr-card--extend">
            <div class="gr-card__head"><div class="gr-card__heading"><span class="gr-card__num" aria-hidden="true">2</span><div><h2 class="gr-card__title">Scope</h2><p class="gr-card__sub">Which part of your organisation should SGS assess against ISO/IEC 27001?</p></div></div></div>
            <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
              <legend class="label-small" style="color: var(--text-secondary); margin-bottom: 4px">Scope <span class="gr-req">*</span></legend>
              <x-import component-from-global-scope="Graphite.Radio" name="sc" label="Use an existing scope" default-checked="{{yes}}"></x-import>
              <x-import component-from-global-scope="Graphite.Radio" name="sc" label="Describe a new scope — your administrator reviews it"></x-import>
              <x-import component-from-global-scope="Graphite.Radio" name="sc" label="Not sure yet — let SGS advise"></x-import>
            </fieldset>
            <x-import component-from-global-scope="Graphite.Combobox" label="Existing scope" required="{{yes}}" default-value="hq" help-text="You only see scopes assigned to you." options="{{scopes}}"></x-import>
            <div style="max-width: 552px"><x-import component-from-global-scope="Graphite.InlineNotification" kind="info" title="A workspace already exists for this scope">ISO/IEC 27001 · Head office is 64% ready. The consultant will start from it.</x-import></div>
            <div style="display: flex; justify-content: space-between; margin-top: auto">
              <div><x-import component-from-global-scope="Graphite.Button" variant="ghost" size="md">Back</x-import></div>
              <x-import component-from-global-scope="Graphite.Button" size="md" icon="arrow--right">Next</x-import>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SGS Consultant – my assignments</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="sgs-ops" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" tone="dark" site-name="Digital Trust Platform" site-sub="Operations Console" badge="Internal" home-links="{{noLinks}}" user-name="Anna Lee" user-email="anna.lee@sgs.com" notifications="{{one}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" tone="dark" label="SGS Operations" sections="{{nav}}" default-active="asg-gap" default-collapsed="{{collapsed}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">My assignments</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Gap analyses assigned to you. A customer workspace opens on the access start date and closes when you submit the final report.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px">
        <x-import component-from-global-scope="Graphite.Tabs" label="Assignment status" tabs="{{tabs}}" default-tab="active"></x-import>
      </section>
    </main>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite, F = window.React.Fragment;

    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' },
      { id: 'asg', label: 'My assignments', icon: 'user--access', badge: 1, badgeTone: 'attention', badgeLabel: 'assignment in progress', children: [
        { id: 'asg-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'in progress' }, { id: 'asg-impl', label: 'Implementation Support' } ] },
      { id: 'fw', label: 'Frameworks', icon: 'catalog' },
      { id: 'settings', label: 'Settings', icon: 'settings' } ] }];
    var extra = {};

    function R(a){ return { id: a[0], cust: a[1], fw: a[2], scope: a[3], site: a[4], access: a[5], st: a[6], wait: a[7], prog: a[8] }; }
    var active = [
      ['GA-2026-002', 'ABC Trading Co., Ltd.', 'ISO/IEC 27001', 'Head office · Taipei', '14 – 18 Sep 2026', 'Open since 11 Sep', 'progress', true, '42 / 116'] ].map(R);
    var upcoming = [
      ['GA-2026-006', 'Formosa Chips Inc.', 'TISAX', 'Hsinchu fab', '20 – 22 Oct 2026', 'Opens 17 Oct', 'scheduled', false, '—'],
      ['GA-2026-005', 'ABC Trading Co., Ltd.', 'ISO/IEC 27701', 'Customer data platform', '14 – 16 Oct 2026', 'Opens 11 Oct', 'scheduled', false, '—'] ].map(R);
    var done = [
      ['GA-2025-044', 'Lotus Cosmetics JSC', 'ISO 22301', 'Head office', '20 – 21 Mar 2026', 'Closed 02 Apr', 'completed', false, '64 / 64'] ].map(R);
    var ST = { progress: ['under-review', 'In progress'], scheduled: ['info', 'Scheduled'], completed: ['completed', 'Completed'] };
    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', { style: { fontWeight: 500 } }, a), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b)); }
    var cols = [
      { key: 'id', header: 'Request', sortable: true, width: 130, render: function(r){ return h('a', { href: r.id === 'GA-2026-002' ? 'ConsultantAssess.dc.html' : r.id === 'GA-2026-005' ? 'ConsultantScheduled.dc.html' : '#', className: 'gr-link', style: { fontWeight: 500 } }, r.id); } },
      { key: 'cust', header: 'Customer · scope', sortable: true, render: function(r){ return two(r.cust, r.scope); } },
      { key: 'fw', header: 'Framework', sortable: true },
      { key: 'site', header: 'On site · workspace access', sortable: true, render: function(r){ return two(r.site, r.access); } },
      { key: 'prog', header: 'Assessed', align: 'end', width: 100 },
      { key: 'st', header: 'Status', render: function(r){ return h('span', { style: { display: 'inline-flex', gap: 4, flexWrap: 'wrap' } }, h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }), r.wait ? h(G.StatusTag, { status: 'missing-info', size: 'sm', label: 'Waiting for customer' }) : null); } } ];
    function T(rows){ return h(G.DataTable, { columns: cols, rows: rows, layout: 'table', paginate: false, rowActions: function(r){ return r.st === 'scheduled' ? [{ label: 'Open' }, { label: 'Upload visit agenda' }] : r.st === 'progress' ? [{ label: 'Open assessment' }, { label: 'Request a document' }, { label: 'Submit final report' }] : [{ label: 'Open' }, { label: 'Download report' }]; } }); }
    extra.crumbs = [{ label: 'My assignments', href: '#' }, { label: 'Gap Analysis' }];
    extra.tabs = [
      { id: 'active', label: 'In progress', badge: active.length, content: T(active) },
      { id: 'up', label: 'Upcoming', badge: upcoming.length, content: T(upcoming) },
      { id: 'done', label: 'Completed', badge: done.length, content: T(done) } ];
    return Object.assign({ yes: true, no: false, one: 1, two: 2, three: 3, s16: 16, nav: nav, noLinks: [], noop: function(){}, collapsed: false }, extra);
  }
}
</script>
</body>
</html>

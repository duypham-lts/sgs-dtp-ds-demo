<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>[MVP] Gap Analysis – step 1</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">

body{margin:0}
</style>
</helmet>
<div data-theme="customer" style="width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" site-name="Digital Trust Platform" site-sub="Customer Portal" user-name="Linh Tran" user-email="linh.tran@abc-trading.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" label="Customer Portal" sections="{{nav}}" default-active="sr-gap" default-collapsed="{{yes}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <x-import component-from-global-scope="Graphite.PageHeader" title="New Gap Analysis" subtitle="Step 1 of 2" on-back="{{noop}}" status="{{draft}}" autosave="saved"></x-import>
      <div style="flex-grow: 1; min-height: 0; display: flex; gap: 20px">
        <div style="width: 220px; flex-shrink: 0; box-sizing: border-box; padding: 12px; border-radius: var(--radius-card); background: var(--layer-02)"><x-import component-from-global-scope="Graphite.SectionNav" label="Steps" items="{{steps}}" default-active="s1"></x-import></div>
        <div style="flex-grow: 1; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column">
          <section class="gr-card gr-card--extend">
            <div class="gr-card__head"><div class="gr-card__heading"><span class="gr-card__num" aria-hidden="true">1</span><div><h2 class="gr-card__title">Framework & scope</h2><p class="gr-card__sub">Pick one framework and the part of your organisation to assess.</p></div></div></div>
            <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
              <legend class="label-small" style="color: var(--text-secondary); margin-bottom: 4px">Framework <span class="gr-req">*</span></legend>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio" checked><span style="display: flex; flex-direction: column"><span class="title-small">ISO/IEC 27001</span><span class="body-small" style="color: var(--text-secondary)">Information Security Management System</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">ISO/IEC 42001</span><span class="body-small" style="color: var(--text-secondary)">Artificial Intelligence Management System</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">ISO/IEC 27701</span><span class="body-small" style="color: var(--text-secondary)">Privacy Information Management System</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">ISO 22301</span><span class="body-small" style="color: var(--text-secondary)">Business Continuity Management System</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">ISO/IEC 20000</span><span class="body-small" style="color: var(--text-secondary)">Service Management System</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">TISAX</span><span class="body-small" style="color: var(--text-secondary)">Trusted Information Security Assessment Exchange</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">NIST CSF</span><span class="body-small" style="color: var(--text-secondary)">Cybersecurity Framework</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--layer-02); cursor: pointer"><input type="radio" name="fw" class="gr-radio"><span style="display: flex; flex-direction: column"><span class="title-small">Cybersecurity Management Act</span><span class="body-small" style="color: var(--text-secondary)">Certification scheme (Taiwan)</span></span></label>
              </div>
            </fieldset>
            <x-import component-from-global-scope="Graphite.Select" label="Scope" required="{{yes}}" size="m" default-value="hq" options="{{scopes}}" help-text="Only scopes assigned to you are listed. Ask your administrator to add a new one."></x-import>
            <div style="max-width: 588px"><x-import component-from-global-scope="Graphite.InlineNotification" kind="info" title="Workspace linked automatically">The consultant reads evidence in your ISO/IEC 27001 · Head office workspace.</x-import></div>
            <div style="display: flex; justify-content: space-between; margin-top: auto"><div></div><x-import component-from-global-scope="Graphite.Button" size="md" icon="arrow--right">Next</x-import></div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

    var h = window.React.createElement, G = window.Graphite;

    var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
      { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },

    var extra = { noop: function(){}, steps: [{"id": "s1", "label": "1. Framework & scope", "status": "incomplete"}, {"id": "s2", "label": "2. Details & submit", "status": "optional"}], draft: { status: 'draft', label: 'Draft', shortLabel: 'Draft' } };
    extra.scopes = [{ value: 'hq', label: 'Head office · Taipei', description: 'Organisation scope' }, { value: 'ai', label: 'AI platform', description: 'Product scope' }, { value: 'tc', label: 'Plant · Taichung', description: 'Site scope' }];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav }, typeof extra === 'object' ? extra : {});

}
</script>

</html>

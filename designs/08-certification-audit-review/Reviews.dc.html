<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer – reviews</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="customer" style="width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" site-name="Digital Trust Platform" site-sub="Customer Portal" user-name="Wei Chen" user-email="wei.chen@abc-trading.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" label="Customer Portal" sections="{{nav}}" default-active="reviews" default-collapsed="{{no}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">Reviews</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Audit reviews SGS runs on your workspaces. Respond to the auditor’s requests and findings here.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px"><x-import component-from-global-scope="Graphite.Tabs" label="Review status" tabs="{{tabs}}"></x-import></section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite;

    var SR = { id: 'sr', label: 'Service Requests', icon: 'task', badge: 1, badgeTone: 'attention', badgeLabel: 'request needs action', children: [
      { id: 'sr-all', label: 'All requests' }, { id: 'sr-cert', label: 'Certification Services' }, { id: 'sr-train', label: 'Training Courses' },
      { type: 'label', label: 'Other services' }, { id: 'sr-gap', label: 'Gap Analysis', badge: 1, badgeTone: 'attention', badgeLabel: 'needs action' }, { id: 'sr-impl', label: 'Implementation Support' } ] };
    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' }, { id: 'scopes', label: 'Scopes', icon: 'category' }, { id: 'ws', label: 'Workspaces', icon: 'folders' },
      { id: 'docs', label: 'Documents', icon: 'document--multiple-01' }, { id: 'reviews', label: 'Reviews', icon: 'view', badge: 3, badgeTone: 'attention', badgeLabel: 'items need your response' }, SR, { id: 'certs', label: 'Certifications', icon: 'checkmark' }, { id: 'training', label: 'Training', icon: 'education' },
      { id: 'audit', label: 'Audit Logs', icon: 'catalog' }, { id: 'settings', label: 'Settings', icon: 'settings' } ] }];

    var extra = { crumbs: [{ label: 'Reviews' }] };
    var ST = { open: ['under-review', 'In progress'], closed: ['completed', 'Closed'] };
    var cols = [
      { key: 'n', header: 'Review', render: function(r){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('a', { href: r.href, className: 'gr-link', style: { fontWeight: 500 } }, r.n), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, r.ws)); } },
      { key: 'req', header: 'Request', width: 130 },
      { key: 'aud', header: 'Auditor', width: 130 },
      { key: 'todo', header: 'Need your response', width: 190, render: function(r){ return r.todo ? h(G.Tag, { tone: 'required' }, r.todo) : '—'; } },
      { key: 'st', header: 'Status', width: 150, render: function(r){ return h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }); } } ];
    var rows = [
      { id: 1, n: 'Audit review · Appendix 10 · 2022', ws: 'Customer data platform · tier Medium', req: 'CR-2026-015', aud: 'David Wu', todo: '3 items · next due 25 Nov', st: 'open', href: 'ReviewFeedback.dc.html' },
      { id: 2, n: 'Audit review · ISO/IEC 27001 · 2022', ws: 'Head office · Taipei', req: 'CR-2026-012', aud: 'David Wu', todo: '', st: 'closed', href: '#' } ];
    extra.tabs = [
      { id: 'o', label: 'Open', badge: 1, content: h(G.DataTable, { columns: cols, rows: rows.filter(function(r){ return r.st === 'open'; }), layout: 'table', paginate: false }) },
      { id: 'c', label: 'Closed', badge: 1, content: h(G.DataTable, { columns: cols, rows: rows.filter(function(r){ return r.st === 'closed'; }), layout: 'table', paginate: false }) } ];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav }, typeof extra === 'object' ? extra : {});
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SGS – certification requests</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/graphite/tokens.css">
<link rel="stylesheet" href="ds/graphite/components/bundle.css">
<script src="ds/graphite/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="sgs-ops" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: var(--font-sans); color: var(--text-primary); background: var(--background)">
  <x-import component-from-global-scope="Graphite.TopBar" variant="home" tone="dark" site-name="Digital Trust Platform" site-sub="Operations Console" badge="Internal" home-links="{{noLinks}}" user-name="Minh Nguyen" user-email="minh.nguyen@sgs.com" notifications="{{three}}"></x-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 12px">
    <div style="flex-shrink: 0; display: flex">
      <x-import component-from-global-scope="Graphite.AppSidebar" tone="dark" label="SGS Operations" sections="{{nav}}" default-active="req-cert" default-collapsed="{{collapsed}}"></x-import>
    </div>
    <main style="flex-grow: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 8px 4px">
        <x-import component-from-global-scope="Graphite.Breadcrumb" items="{{crumbs}}"></x-import>
        <h1 class="headline-medium" style="margin: 8px 0 0 0">Certification requests</h1>
        <p class="body-medium" style="margin: 0; color: var(--text-secondary)">Assign each request to an SGS Auditor/Certification. After the audit closes, create the certification record.</p>
      </div>
      <section class="gr-card gr-card--extend" style="padding: 16px 24px"><x-import component-from-global-scope="Graphite.Tabs" label="Request status" tabs="{{tabs}}"></x-import></section>
    </main>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var h = window.React.createElement, G = window.Graphite, F = window.React.Fragment;

    var nav = [{ items: [
      { id: 'home', label: 'Home', icon: 'dashboard' },
      { id: 'req', label: 'Requests', icon: 'task', badge: 3, badgeTone: 'attention', badgeLabel: 'requests need triage', children: [
        { id: 'req-all', label: 'All requests' }, { id: 'req-cert', label: 'Certification' }, { id: 'req-train', label: 'Training' },
        { type: 'label', label: 'Other services' }, { id: 'req-gap', label: 'Gap Analysis', badge: 3, badgeTone: 'attention', badgeLabel: 'need triage' }, { id: 'req-impl', label: 'Implementation Support' } ] },
      { id: 'certs', label: 'Certifications', icon: 'checkmark' },
      { id: 'cust', label: 'Customers', icon: 'category' },
      { id: 'fw', label: 'Frameworks', icon: 'catalog' },
      { id: 'asg', label: 'Assignments', icon: 'user--access' },
      { id: 'audit', label: 'Audit Logs', icon: 'document' },
      { id: 'settings', label: 'Settings', icon: 'settings' } ] }];
    var extra = {};

    var ST = { submitted: ['under-review', 'Submitted'], assigned: ['info', 'Assigned'], progress: ['under-review', 'In progress'], done: ['completed', 'Audit completed'], cert: ['completed', 'Certificate issued'], rejected: ['rejected', 'Rejected'] };
    function two(a, b){ return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', { style: { fontWeight: 500 } }, a), h('span', { className: 'body-small', style: { color: 'var(--text-secondary)' } }, b)); }
    var all = [
      { id: 'CR-2026-018', cust: 'Lotus Cosmetics JSC', ws: 'ISO 22301 · 2019 · Head office', per: 'Jan 2027', aud: '—', st: 'submitted' },
      { id: 'CR-2026-017', cust: 'Formosa Chips Inc.', ws: 'TISAX · ISA 6.0 · Hsinchu fab', per: 'Dec 2026', aud: 'Wei Lin', st: 'assigned' },
      { id: 'CR-2026-015', cust: 'ABC Trading Co., Ltd.', ws: 'Appendix 10 · 2022 · Customer data platform · Medium', per: 'Nov 2026', aud: 'David Wu', st: 'progress' },
      { id: 'CR-2026-012', cust: 'ABC Trading Co., Ltd.', ws: 'ISO/IEC 27001 · 2022 · Head office', per: 'Oct 2026', aud: 'David Wu', st: 'done' },
      { id: 'CR-2026-004', cust: 'Formosa Chips Inc.', ws: 'ISO/IEC 27017 · Cloud services', per: 'Q3 2026', aud: 'Wei Lin', st: 'cert' } ];
    var cols = [
      { key: 'id', header: 'Request', width: 130, render: function(r){ return h('a', { href: r.id === 'CR-2026-012' ? 'SgsCreateCert.dc.html' : '#', className: 'gr-link', style: { fontWeight: 500 } }, r.id); } },
      { key: 'cust', header: 'Customer · workspace', render: function(r){ return two(r.cust, r.ws); } },
      { key: 'per', header: 'Preferred', width: 110 },
      { key: 'aud', header: 'Auditor', width: 130 },
      { key: 'st', header: 'Status', width: 170, render: function(r){ return h(G.StatusTag, { status: ST[r.st][0], size: 'sm', label: ST[r.st][1] }); } } ];
    function T(sts, acts){ return h(G.DataTable, { columns: cols, rows: all.filter(function(r){ return sts.indexOf(r.st) >= 0; }), layout: 'table', searchable: true, searchPlaceholder: 'Search requests or customers', rowActions: function(){ return acts; } }); }
    var extra = { crumbs: [{ label: 'Requests', href: '#' }, { label: 'Certification' }] };
    extra.tabs = [
      { id: 'todo', label: 'To assign', badge: 1, content: T(['submitted'], [{ label: 'Assign auditor' }, { label: 'Reject', danger: true }]) },
      { id: 'run', label: 'In audit', badge: 2, content: T(['assigned', 'progress'], [{ label: 'Open' }, { label: 'Change auditor' }]) },
      { id: 'cert', label: 'Ready for certificate', badge: 1, content: T(['done'], [{ label: 'Create certification record' }]) },
      { id: 'closed', label: 'Closed', badge: 1, content: T(['cert', 'rejected'], [{ label: 'Open' }]) } ];
    return Object.assign({ yes: true, no: false, three: 3, nav: nav, noLinks: [], noop: function(){}, collapsed: false }, extra);
  }
}
</script>
</body>
</html>
